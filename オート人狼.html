<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>オート人狼ノベル 〜霧の欺瞞劇〜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background-color: #070b14;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* Text overflow & alignment guards */
    .text-safe-wrap {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* Subtle animations */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes cutInTopLeft {
      0% {
        opacity: 0;
        transform: translate(-18px, -8px) scale(0.95);
      }
      18% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      82% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-10px, -4px) scale(0.98);
      }
    }
    @keyframes cutInCenter {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(8px);
      }
      15% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      85% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      100% {
        opacity: 0;
        transform: scale(0.96) translateY(-6px);
      }
    }
    @keyframes speakerPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.45);
      }
      50% {
        box-shadow: 0 0 0 6px rgba(251, 191, 36, 0);
      }
    }

    .pop-in {
      animation: fadeSlideUp 0.24s ease-out both;
    }
    .turn-cutin-anim {
      animation: cutInTopLeft 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .event-cutin-anim {
      animation: cutInCenter 2.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .speaking-ring {
      animation: speakerPulse 1.6s infinite;
    }

    /* Round table stage */
    .round-table-stage {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 292px;
      margin: 0 auto;
    }
    @media (min-width: 640px) {
      .round-table-stage {
        height: 316px;
      }
    }
    .round-table-surface {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 54%;
      height: 46%;
      border-radius: 9999px;
      background: radial-gradient(circle at 40% 35%, rgba(30, 41, 59, 0.92), rgba(10, 16, 30, 0.96));
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: inset 0 0 28px rgba(2, 6, 23, 0.85), 0 8px 24px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      text-align: center;
      pointer-events: none;
    }
    .round-seat {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 72px;
      transition: transform 0.2s ease, opacity 0.25s ease;
    }
    @media (min-width: 640px) {
      .round-seat {
        width: 84px;
      }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
      border-radius: 2px;
    }
  </style>
</head>
<body class="min-h-screen bg-[#070b14] text-slate-100 antialiased selection:bg-amber-400/30 selection:text-amber-100">
  <div id="app" class="mx-auto max-w-[1440px] px-3 py-3 sm:px-5 sm:py-4">
    <!-- Top Header Bar -->
    <header class="mb-3 rounded border border-slate-800/90 bg-slate-950/90 px-3.5 py-2.5 shadow-lg">
      <div class="flex flex-wrap items-center justify-between gap-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="h-2.5 w-2.5 rounded-xs bg-amber-400 shrink-0"></span>
          <h1 class="text-sm sm:text-base font-black tracking-wider text-white truncate">
            オート人狼ノベル <span class="text-amber-300 font-bold">〜霧の欺瞞劇〜</span>
          </h1>
          <span id="matchCounterBadge" class="rounded-xs border border-slate-700 bg-slate-900 px-2 py-0.5 text-[11px] font-bold text-slate-300 shrink-0">
            第1戦
          </span>
        </div>

        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
          <!-- View Mode Switch: 推理モード / 神視点モード -->
          <button id="toggleViewModeBtn" type="button" class="cursor-pointer rounded-xs border border-sky-500/40 bg-sky-500/15 px-2.5 py-1.5 text-xs font-bold text-sky-200 hover:bg-sky-500/25 transition min-h-[34px]">
            視点: 推理モード
          </button>

          <button id="openHistoryBtn" type="button" class="cursor-pointer rounded-xs border border-indigo-500/40 bg-indigo-500/15 px-2.5 py-1.5 text-xs font-bold text-indigo-200 hover:bg-indigo-500/25 transition min-h-[34px]">記録を見る</button>

          <!-- Pause / Resume -->
          <button id="togglePauseBtn" type="button" class="cursor-pointer rounded-xs border border-amber-500/40 bg-amber-500/15 px-2.5 py-1.5 text-xs font-bold text-amber-200 hover:bg-amber-500/25 transition min-h-[34px]">
            一時停止
          </button>

          <!-- Speed selector -->
          <button id="cycleSpeedBtn" type="button" class="cursor-pointer rounded-xs border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-xs font-bold text-slate-200 hover:bg-slate-800 transition min-h-[34px]">
            速度: 1.0x
          </button>

          <!-- SE Toggle -->
          <button id="toggleSeBtn" type="button" class="cursor-pointer rounded-xs border border-emerald-500/40 bg-emerald-500/15 px-2.5 py-1.5 text-xs font-bold text-emerald-200 hover:bg-emerald-500/25 transition min-h-[34px]">
            SE: ON
          </button>

          <!-- BGM Toggle -->
          <button id="toggleBgmBtn" type="button" class="cursor-pointer rounded-xs border border-violet-500/40 bg-violet-500/15 px-2.5 py-1.5 text-xs font-bold text-violet-200 hover:bg-violet-500/25 transition min-h-[34px]">
            BGM: ON
          </button>

          <!-- New Match -->
          <button id="restartMatchBtn" type="button" class="cursor-pointer rounded-xs border border-rose-500/40 bg-rose-500/15 px-2.5 py-1.5 text-xs font-bold text-rose-200 hover:bg-rose-500/25 transition min-h-[34px]">
            次の試合へ
          </button>
        </div>
      </div>
    </header>

    <!-- Main 12-Column Responsive Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-3.5 items-start">
      <!-- Left / Center Stage (8 cols on lg) -->
      <main class="lg:col-span-8 flex flex-col gap-3 min-w-0">
        <!-- Stage Box (Always visible compact status + Round Table + Top-Left Turn Cut-In) -->
        <section class="relative rounded border border-slate-800/90 bg-slate-950/90 shadow-xl overflow-hidden">
          <!-- Compact Permanent Status Header (No animation) -->
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 bg-slate-900/70 px-3.5 py-2">
            <div class="flex items-center gap-2 min-w-0">
              <span id="permanentPhaseBadge" class="rounded-xs border border-amber-400/40 bg-amber-500/15 px-2 py-0.5 text-[11px] font-black text-amber-200 shrink-0">
                DAY 1
              </span>
              <span id="permanentTurnLabel" class="text-xs sm:text-sm font-black text-white truncate">
                Turn 1
              </span>
              <span id="permanentPhaseSub" class="text-[11px] text-slate-400 truncate">
                朝の議論フェーズ
              </span>
            </div>

            <div class="flex items-center gap-2 text-[11px] font-bold text-slate-300 shrink-0">
              <span id="aliveCountBadge" class="rounded-xs bg-slate-800/90 px-2 py-0.5 text-emerald-300">生存: 9/9</span>
              <span id="partnershipCountBadge" class="hidden rounded-xs bg-indigo-950/90 border border-indigo-500/30 px-2 py-0.5 text-indigo-200"></span>
            </div>
          </div>

          <!-- Top-Left Turn Cut-In Overlay (Separate from permanent header) -->
          <div id="turnCutInOverlay" class="pointer-events-none hidden absolute top-11 left-3 z-20">
            <div id="turnCutInCard" class="rounded-xs border-l-4 border-amber-400 bg-slate-950/95 px-3 py-1.5 shadow-xl border border-slate-700/80">
              <div id="turnCutInTitle" class="text-xs sm:text-sm font-black tracking-wider text-amber-300"></div>
              <div id="turnCutInSub" class="text-[10px] text-slate-300"></div>
            </div>
          </div>

          <!-- Top-Right Lie Cut-In Overlay (Small popup in upper right of round-table box) -->
          <div id="lieCutInOverlay" class="pointer-events-none hidden absolute top-11 right-3 z-20 max-w-[220px]">
            <div id="lieCutInCard" class="rounded-xs border-r-2 border-cyan-400 bg-slate-950/95 px-2.5 py-1 text-right shadow-lg border border-cyan-500/40">
              <div id="lieCutInKicker" class="text-[9px] font-bold tracking-wider text-cyan-300 truncate"></div>
              <div id="lieCutInMain" class="text-[11px] font-black text-white truncate"></div>
              <div id="lieCutInDetail" class="text-[9px] text-slate-300 truncate"></div>
            </div>
          </div>

          <!-- Center Event Cut-In Overlay (Victim / Exile / Victory) -->
          <div id="eventCutInOverlay" class="pointer-events-none hidden absolute inset-x-4 top-1/2 -translate-y-1/2 z-30 flex justify-center">
            <div id="eventCutInCard" class="max-w-md w-full rounded border border-amber-400/50 bg-slate-950/95 px-4 py-3 text-center shadow-2xl">
              <div id="eventCutInKicker" class="text-[10px] font-black tracking-widest uppercase text-amber-300"></div>
              <div id="eventCutInMain" class="mt-0.5 text-base sm:text-lg font-black text-white text-safe-wrap"></div>
              <div id="eventCutInDetail" class="mt-1 text-xs text-slate-300 text-safe-wrap"></div>
            </div>
          </div>

          <!-- Circular Round-Table Stage -->
          <div class="p-3 sm:p-4 flex flex-col justify-center">
            <div id="stageRoundTable" class="round-table-stage">
              <div class="round-table-surface">
                <span id="tableCenterPhase" class="text-[10px] font-bold tracking-widest text-amber-300/80 uppercase">DAY 1</span>
                <span id="tableCenterStatus" class="text-xs sm:text-sm font-black text-slate-200 mt-0.5 truncate max-w-full">円卓の議論</span>
                <span id="tableCenterSub" class="text-[10px] text-slate-400 mt-0.5 truncate max-w-full">9名が席に着いている</span>
              </div>
              <div id="stageSeatsLayer" class="absolute inset-0"></div>
            </div>
          </div>
        </section>

        <!-- Visual Novel Message Window -->
        <section class="rounded border border-slate-700/90 bg-slate-950/95 shadow-2xl overflow-hidden">
          <div class="h-1 w-full bg-slate-900">
            <div id="stepProgressBar" class="h-full w-0 bg-amber-400 transition-none"></div>
          </div>

          <div class="p-3.5 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-2 mb-2.5 border-b border-slate-800/80">
              <div class="flex items-center gap-2 min-w-0">
                <span id="dialogueSpeakerDot" class="h-3 w-3 rounded-xs shrink-0 bg-sky-400"></span>
                <span id="dialogueSpeakerName" class="text-base sm:text-lg font-black tracking-wide text-white truncate">待機中</span>
                <span id="dialogueCoBadge" class="hidden rounded-xs border border-cyan-400/50 bg-cyan-500/20 px-1.5 py-0.5 text-[10px] font-black text-cyan-200 shrink-0">占CO</span>
                <span id="dialogueActionTag" class="hidden rounded-xs border border-sky-400/40 bg-sky-500/15 px-2 py-0.5 text-[11px] font-bold text-sky-200 text-safe-wrap"></span>
              </div>
              <span id="dialogueHint" class="hidden rounded-xs border border-amber-400/35 bg-amber-500/10 px-2 py-0.5 text-[11px] font-medium text-amber-200 text-safe-wrap"></span>
            </div>

            <div id="dialogueText" class="min-h-[4.25rem] sm:min-h-[4.75rem] text-sm sm:text-base leading-relaxed font-medium text-slate-100 text-safe-wrap"></div>
          </div>
        </section>

        <!-- Voting Summary Table (Placed below Message Window so exile speech remains visible) -->
        <section id="voteSummaryPanel" class="hidden rounded border border-rose-500/40 bg-slate-950/95 p-3 pop-in shadow-lg">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-1.5 mb-2">
            <span class="text-xs font-black tracking-wider text-rose-300">投票集計表</span>
            <span id="voteExiledSummaryBadge" class="rounded-xs bg-rose-500/20 border border-rose-500/40 px-2 py-0.5 text-[11px] font-bold text-rose-200"></span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="border-b border-slate-800 text-[11px] text-slate-400">
                  <th class="py-1.5 pr-2 font-semibold">投票者</th>
                  <th class="py-1.5 px-2 font-semibold">投票先</th>
                  <th class="py-1.5 pl-2 text-right font-semibold">対象被票数</th>
                </tr>
              </thead>
              <tbody id="voteSummaryTbody" class="divide-y divide-slate-800/70"></tbody>
            </table>
          </div>
        </section>

        <!-- Seer Results Summary -->
        <section id="seerResultsPanel" class="rounded border border-cyan-500/30 bg-slate-950/95 p-3 shadow-lg">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-1.5 mb-2">
            <span class="text-xs font-black tracking-wider text-cyan-200">占い結果一覧</span>
            <span id="seerResultsCount" class="text-[10px] text-slate-400">公表済みの結果</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="border-b border-slate-800 text-[10px] text-slate-400">
                  <th class="py-1.5 pr-2 font-semibold">日／ターン</th>
                  <th class="py-1.5 px-2 font-semibold">占い師CO</th>
                  <th class="py-1.5 px-2 font-semibold">対象</th>
                  <th class="py-1.5 pl-2 text-right font-semibold">結果</th>
                </tr>
              </thead>
              <tbody id="seerResultsTbody" class="divide-y divide-slate-800/70"></tbody>
            </table>
          </div>
        </section>

        <!-- Monitor Room (Eliminated Players Banter) -->
        <section class="rounded border border-slate-800/90 bg-slate-950/90 p-3 shadow-lg">
          <div class="flex items-center justify-between gap-2 border-b border-slate-800/80 pb-1.5 mb-2">
            <div class="flex items-center gap-2">
              <span class="h-2 w-2 rounded-xs bg-indigo-400"></span>
              <h2 class="text-xs font-black tracking-wider text-indigo-200">モニタールーム</h2>
            </div>
            <span class="text-[11px] text-slate-400">退場者たちの談話・掛け合い</span>
          </div>
          <div id="monitorRoomFeed" class="max-h-36 overflow-y-auto space-y-1.5 pr-1 text-xs">
            <div class="text-slate-500 italic py-1">まだモニタールームに誰も入室していません。</div>
          </div>
        </section>
      </main>

      <!-- Right Sidebar: Cast Status, Relations & Log (4 cols on lg) -->
      <aside class="lg:col-span-4 flex flex-col gap-3 min-w-0">
        <!-- Participants List -->
        <section class="rounded border border-slate-800/90 bg-slate-950/90 p-3 shadow-lg">
          <div class="flex items-center justify-between gap-2 border-b border-slate-800/80 pb-1.5 mb-2">
            <h2 class="text-xs font-black tracking-wider text-slate-200">参加者一覧（今戦9名）</h2>
            <span id="modeSubLabel" class="text-[11px] text-sky-300 font-semibold">推理視点</span>
          </div>
          <div id="participantRoster" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-1.5 max-h-[340px] overflow-y-auto pr-0.5"></div>
        </section>

        <!-- Discussion & Event Log -->
        <section class="rounded border border-slate-800/90 bg-slate-950/90 p-3 shadow-lg">
          <div class="flex items-center justify-between gap-2 border-b border-slate-800/80 pb-1.5 mb-2">
            <h2 class="text-xs font-black tracking-wider text-slate-200">進行ログ</h2>
            <span class="text-[11px] text-slate-400">最新順</span>
          </div>
          <div id="eventLogList" class="max-h-[260px] overflow-y-auto space-y-1.5 pr-0.5 text-xs"></div>
        </section>
      </aside>
    </div>
  </div>


  <!-- Vote / Night History Modal -->
  <div id="historyModal" class="hidden fixed inset-0 z-[105] flex items-center justify-center bg-slate-950/85 p-3">
    <section class="w-full max-w-2xl max-h-[88vh] overflow-y-auto rounded border border-indigo-500/40 bg-slate-950 p-4 shadow-2xl">
      <div class="flex items-center justify-between gap-3 border-b border-slate-800 pb-2 mb-3">
        <h2 class="text-base font-black text-white">試合記録</h2>
        <button id="closeHistoryBtn" type="button" class="rounded border border-slate-700 px-2.5 py-1 text-xs font-bold text-slate-200 hover:bg-slate-800">閉じる</button>
      </div>
      <div id="historyContent" class="space-y-3"></div>
    </section>
  </div>

  <!-- Character Detail Modal -->
  <div id="characterDetailModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/85 p-3">
    <section class="w-full max-w-lg max-h-[88vh] overflow-y-auto rounded border border-sky-500/40 bg-slate-950 p-4 shadow-2xl">
      <div class="flex items-center justify-between gap-3 border-b border-slate-800 pb-2 mb-3">
        <h2 id="characterDetailTitle" class="text-base font-black text-white">キャラクター詳細</h2>
        <button id="closeCharacterDetailBtn" type="button" class="rounded border border-slate-700 px-2.5 py-1 text-xs font-bold text-slate-200 hover:bg-slate-800">閉じる</button>
      </div>
      <div id="characterDetailContent" class="space-y-3"></div>
    </section>
  </div>

  <script>
    /**
     * =========================================================================
     * 1. CHARACTER ROSTER & ROLES
     * =========================================================================
     */
    const CHARACTER_POOL = [
      { id:'miva', name:'ミヴァ', color:'#3E91A4', gender:'男性', firstPerson:'俺', tone:'miva', archetype:'面倒くさがりでぶっきらぼうな皮肉屋。お調子者な一面もあり、基本はロジカルだが自分の利益を優先し、LOVE値も交渉材料にする。', stats:{logic:82,charisma:48,stealth:28,intuition:96,cuteness:58,acting:64}, bias:{logicHeavy:true,loveFocus:true,usesLoveStrategically:true} },
      { id:'rimera', name:'リメラ', color:'#F1A7AA', gender:'女性', firstPerson:'アタシ', tone:'rimera', archetype:'熱血気味の人情派なおてんば女王。正義感と好奇心が強く、疑うのは苦手だが行動は早い。周囲の好意を集めるのが得意で、嘘は顔に出やすい。', stats:{logic:38,charisma:96,stealth:24,intuition:68,cuteness:96,acting:12}, bias:{logicHeavy:false,loveFocus:true,defendsOften:true} },
      { id:'tesuke', name:'テスケ', color:'#2878C8', gender:'男性', firstPerson:'私', tone:'tesuke', archetype:'冷静で距離を置かれがちなことも自覚している。言い切り口調で可能性を広く検討し、時折ジョークで場を和ませる。', stats:{logic:97,charisma:76,stealth:62,intuition:72,cuteness:28,acting:78}, bias:{logicHeavy:true,loveFocus:false,correctsOthers:true} },
      { id:'nana', name:'ナナ', color:'#E5B923', gender:'男性', firstPerson:'僕', tone:'nana', archetype:'無口なハードボイルド。短く鋭い発言を基本とし、要所では冷静かつ非常に論理的に意見を述べる。LOVE値が高い相手は疑いきれないことがある。', stats:{logic:96,charisma:42,stealth:91,intuition:68,cuteness:34,acting:24}, bias:{logicHeavy:true,loveFocus:true,highLoveTowardMiva:true} },
      { id:'ardent', name:'アーデント', color:'#D92D2D', gender:'女性', firstPerson:'私', tone:'ardent', archetype:'無口なハードボイルド。必要な情報を集め、気になる点は即座に問い詰める。意志は強いが、判断は直感やLOVE値に寄りやすい。', stats:{logic:34,charisma:88,stealth:24,intuition:94,cuteness:42,acting:56}, bias:{logicHeavy:false,loveFocus:true,questionsQuickly:true} },

    /**
     * =========================================================================
     * 2. AUDIO ENGINE (SE + PHASE BGM WITH INDEPENDENT TOGGLES)
     * =========================================================================
     */
    const AudioEngine = (() => {
      let ctx = null;
      let seEnabled = true;
      let bgmEnabled = true;
      let currentBgmPhase = null;
      let bgmTimer = null;
      let stepIndex = 0;

      function ensureContext() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            ctx = new AudioCtx();
          }
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function playPopo(pitchMultiplier = 1) {
        if (!seEnabled) return;
        const c = ensureContext();
        if (!c) return;
        try {
          const now = c.currentTime;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'triangle';
          const baseFreq = 520 * pitchMultiplier + (Math.random() * 60 - 30);
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.18, now + 0.045);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.032, now + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.055);

          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        } catch (_) {}
      }

      function playCutInChime(kind = 'turn') {
        if (!seEnabled) return;
        const c = ensureContext();
        if (!c) return;
        try {
          const now = c.currentTime;
          const notes = kind === 'alert' ? [330, 440, 277.18] : [440, 554.37, 659.25];
          notes.forEach((freq, idx) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = kind === 'alert' ? 'sawtooth' : 'sine';
            const t = now + idx * 0.065;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(kind === 'alert' ? 0.03 : 0.04, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.22);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.24);
          });
        } catch (_) {}
      }

      function playTone(freq, duration, type = 'sine', vol = 0.025, delay = 0) {
        if (!bgmEnabled) return;
        const c = ensureContext();
        if (!c) return;
        try {
          const now = c.currentTime + delay;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.0005, now);
          gain.gain.linearRampToValueAtTime(vol, now + Math.min(0.04, duration * 0.2));
          gain.gain.exponentialRampToValueAtTime(0.0005, now + duration);

          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (_) {}
      }

      function stopBgmLoop() {
        if (bgmTimer) {
          clearInterval(bgmTimer);
          bgmTimer = null;
        }
      }

      function runBgmTick(phase) {
        if (!bgmEnabled) return;
        if (phase === 'MORNING') {
          // Mysterious deduction BGM (D minor / Dorian inquisitive motif)
          const pattern = [293.66, 349.23, 440.0, 466.16, 440.0, 329.63, 349.23, 220.0];
          const note = pattern[stepIndex % pattern.length];
          playTone(note, 0.36, 'triangle', 0.024, 0);
          if (stepIndex % 2 === 0) {
            playTone(note * 0.5, 0.65, 'sine', 0.02, 0);
          }
          if (stepIndex % 4 === 2) {
            playTone(587.33, 0.25, 'sine', 0.012, 0.12);
          }
        } else if (phase === 'VOTING') {
          // Quiet, tense BGM (balanced volume, low pulse + sparse tension interval)
          const pulse = stepIndex % 2 === 0 ? 110.0 : 103.83;
          playTone(pulse, 0.42, 'sine', 0.022, 0);
          if (stepIndex % 4 === 1) {
            playTone(311.13, 0.38, 'triangle', 0.013, 0);
          } else if (stepIndex % 4 === 3) {
            playTone(293.66, 0.38, 'triangle', 0.012, 0);
          }
        } else if (phase === 'NIGHT') {
          // Swelling atmospheric night ambience
          const swellNotes = [196.0, 233.08, 293.66, 349.23, 293.66, 220.0, 261.63, 329.63];
          const n = swellNotes[stepIndex % swellNotes.length];
          playTone(n, 0.65, 'sine', 0.02, 0);
          if (stepIndex % 2 === 0) {
            playTone(n * 1.5, 0.5, 'triangle', 0.012, 0.08);
          }
        }
        stepIndex++;
      }

      function setBgmPhase(phase) {
        currentBgmPhase = phase;
        stopBgmLoop();
        stepIndex = 0;
        if (!bgmEnabled || !phase) return;
        const intervalMs = phase === 'MORNING' ? 420 : phase === 'VOTING' ? 520 : 580;
        runBgmTick(phase);
        bgmTimer = setInterval(() => runBgmTick(phase), intervalMs);
      }

      function setSeEnabled(val) {
        seEnabled = Boolean(val);
      }

      function setBgmEnabled(val) {
        bgmEnabled = Boolean(val);
        if (!bgmEnabled) {
          stopBgmLoop();
        } else if (currentBgmPhase) {
          setBgmPhase(currentBgmPhase);
        }
      }

      return {
        ensureContext,
        playPopo,
        playCutInChime,
        setBgmPhase,
        setSeEnabled,
        setBgmEnabled,
        isSeEnabled: () => seEnabled,
        isBgmEnabled: () => bgmEnabled
      };
    })();

    /**
     * =========================================================================
     * 3. GAME STATE & HELPERS
     * =========================================================================
     */
    const GameState = {
      matchNumber: 1,
      viewMode: 'DEDUCTION', // 'DEDUCTION' | 'GOD'
      paused: false,
      speed: 1.0,
      day: 1,
      turn: 1,
      maxTurns: 5,
      phase: 'MORNING', // 'MORNING' | 'VOTING' | 'NIGHT' | 'ENDED'
      players: [],
      loveMatrix: {},
      trustMatrix: {},
      alertnessMatrix: {},
      grievanceMatrix: {}, // 相手への反発・対抗心
      agreementMatrix: {}, // 議論上の意見一致度
      favorMatrix: {}, // 庇護・恩義の蓄積
      interactionHistory: [], // 公開された議論・反応の履歴
      coCallDays: [], // 同じ日に「名乗り出ろ」を繰り返さない
      partnerships: [], // [{ aId, bId }]
      coTurnUsed: false, // Once CO happens in a turn, no CO can happen in any later turn
      coLockedForMatch: false,
      coSeerRecords: [], // [{ playerId, trueRoleKey, coDay, coTurn, targets: [{ targetId, isWolf }] }]
      seerHistoryMap: {}, // targetId -> [{ seerId, isWolf, day, turn }]
      confirmedHumanIds: [],
      confirmedEnemyIds: [],
      exiledTodayEnemyIds: [],
      detectedLies: [], // [{ observerId, targetId, statementId, reason, day, turn }]
      voteHistory: [], // [{ day, votes:[{voterId,targetId}], tally, exiledId }]
      nightHistory: [], // [{ day, hunterId, guardedId, wolfIds, attackedId, protected }]
      currentVoteEntries: [],
      observerKnownFaction: {}, // observerId -> { targetId: faction }
      statementSequence: 0,
      parameterChangeLog: [], // God-view audit trail
      lastChatterId: null,
      lastChatterJoinerId: null,
      lastChatterStopped: false,
      lastSuspectedMap: {}, // suspectId -> lastSuspecterId
      lastDefendedMap: {}, // defendedId -> lastDefenderId
      lastGuardedId: null,
      stepTimer: null,
      typeTimer: null,
      activeStepToken: 0,
      monitorBanterTimer: null
    };

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getPlayerById(id) {
      return GameState.players.find(p => p.id === id) || null;
    }

    function getAlivePlayers() {
      return GameState.players.filter(p => p.alive);
    }

    function getDeadPlayers() {
      return GameState.players.filter(p => !p.alive);
    }

    // 「絶対に敵」と公に指摘された生存者は、以降の議論に参加できない。
    function getDiscussionPlayers() {
      return getAlivePlayers().filter(p => !GameState.confirmedEnemyIds.includes(p.id));
    }

    function getLove(fromP, toP) {
      if (!fromP || !toP || fromP.id === toP.id) return 0;
      return GameState.loveMatrix[fromP.id]?.[toP.id] ?? 0;
    }

    function recordParameterChange(fromP, toP, label, before, after, reason = '行動による変化') {
      if (!fromP || !toP || before === after) return;
      const entry = { day: GameState.day, turn: GameState.turn, actorId: fromP.id, targetId: toP.id, label, before, after, delta: after - before, reason };
      GameState.parameterChangeLog.push(entry);
      if (GameState.parameterChangeLog.length > 180) GameState.parameterChangeLog.shift();
      if (GameState.viewMode === 'GOD') {
        const sign = entry.delta > 0 ? '+' : '';
        pushLog('数値変化', `${fromP.name} → ${toP.name}：${label} ${sign}${entry.delta}（${reason}）`, fromP.color);
      }
    }

    function adjustLove(fromP, toP, delta, reason = '関係性の変化') {
      if (!fromP || !toP || fromP.id === toP.id) return;
      const cur = GameState.loveMatrix[fromP.id][toP.id] ?? 0;
      const next = Math.max(-100, Math.min(100, cur + delta));
      GameState.loveMatrix[fromP.id][toP.id] = next;
      recordParameterChange(fromP, toP, 'LOVE', cur, next, reason);
    }

    function getTrust(fromP, toP) {
      if (!fromP || !toP || fromP.id === toP.id) return 50;
      return GameState.trustMatrix[fromP.id]?.[toP.id] ?? 50;
    }

    function adjustTrust(fromP, toP, delta, reason = '信頼の変化') {
      if (!fromP || !toP || fromP.id === toP.id) return;
      const cur = GameState.trustMatrix[fromP.id][toP.id] ?? 50;
      const next = Math.max(0, Math.min(100, cur + delta));
      GameState.trustMatrix[fromP.id][toP.id] = next;
      recordParameterChange(fromP, toP, '信頼度', cur, next, reason);
    }

    function getAlertness(fromP, toP) {
      if (!fromP || !toP || fromP.id === toP.id) return 20;
      return GameState.alertnessMatrix[fromP.id]?.[toP.id] ?? 20;
    }

    function adjustAlertness(fromP, toP, delta, reason = '警戒心の変化') {
      if (!fromP || !toP || fromP.id === toP.id) return;
      const cur = GameState.alertnessMatrix[fromP.id][toP.id] ?? 20;
      const next = Math.max(0, Math.min(100, cur + delta));
      GameState.alertnessMatrix[fromP.id][toP.id] = next;
      recordParameterChange(fromP, toP, '警戒心', cur, next, reason);
    }

    function getRelationValue(matrixName, fromP, toP) {
      if (!fromP || !toP || fromP.id === toP.id) return 0;
      return GameState[matrixName]?.[fromP.id]?.[toP.id] ?? 0;
    }

    function changeRelationValue(matrixName, fromP, toP, delta, min = -100, max = 100) {
      if (!fromP || !toP || fromP.id === toP.id) return;
      if (!GameState[matrixName]) GameState[matrixName] = {};
      if (!GameState[matrixName][fromP.id]) GameState[matrixName][fromP.id] = {};
      const current = GameState[matrixName][fromP.id][toP.id] ?? 0;
      const next = Math.max(min, Math.min(max, current + delta));
      GameState[matrixName][fromP.id][toP.id] = next;
      const labels = { grievanceMatrix: '反発', agreementMatrix: '意見一致度', favorMatrix: '恩義・庇護' };
      recordParameterChange(fromP, toP, labels[matrixName] || matrixName, current, next, '行動による関係変化');
    }

    function recordPublicAction(action) {
      if (!action?.actor) return;
      const actor = action.actor;
      const target = action.target || null;
      const type = action.actionType;
      GameState.interactionHistory.push({ day: GameState.day, turn: GameState.turn, actorId: actor.id, targetId: target?.id || null, type });
      if (GameState.interactionHistory.length > 180) GameState.interactionHistory.splice(0, GameState.interactionHistory.length - 180);
      if (!target) return;

      if (type === 'SUSPECT' || type === 'CERTAIN_ENEMY') {
        adjustAlertness(target, actor, type === 'CERTAIN_ENEMY' ? 18 : 7);
        changeRelationValue('grievanceMatrix', target, actor, type === 'CERTAIN_ENEMY' ? 20 : 9);
        changeRelationValue('grievanceMatrix', actor, target, 3);
      } else if (type === 'DEFEND' || type === 'DEFEND_JOIN' || type === 'CERTAIN_HUMAN') {
        changeRelationValue('favorMatrix', target, actor, type === 'CERTAIN_HUMAN' ? 12 : 8);
        changeRelationValue('agreementMatrix', actor, target, 8);
        adjustTrust(target, actor, 5);
      } else if (type === 'AGREE_SUSPECT') {
        changeRelationValue('agreementMatrix', actor, target, 7);
        adjustTrust(actor, target, 3);
      } else if (type === 'DENY_SUSPICION') {
        changeRelationValue('grievanceMatrix', actor, target, 4);
      } else if (type === 'PARTNER_ACCEPT') {
        changeRelationValue('favorMatrix', actor, target, 10);
        changeRelationValue('favorMatrix', target, actor, 10);
        adjustTrust(actor, target, 6);
        adjustTrust(target, actor, 6);
      } else if (type === 'PARTNER_BREAK' || type === 'PARTNER_DECLINE') {
        changeRelationValue('grievanceMatrix', actor, target, 8);
        changeRelationValue('grievanceMatrix', target, actor, 5);
      }
    }

    function getRecentTargetedPressure(observer, target) {
      if (!observer || !target) return 0;
      const recent = GameState.interactionHistory.filter(e => e.targetId === observer.id && e.actorId === target.id);
      return Math.min(36, recent.reduce((sum, e) => sum + (e.type === 'CERTAIN_ENEMY' ? 18 : e.type === 'SUSPECT' ? 8 : 0), 0));
    }

    function getPersonalThreatScore(actor, target) {
      if (!actor || !target) return 0;
      const logic = (actor.stats.logic || 0) / 100;
      const alert = getAlertness(actor, target);
      const grievance = getRelationValue('grievanceMatrix', actor, target);
      const agreement = getRelationValue('agreementMatrix', actor, target);
      const pressure = getRecentTargetedPressure(actor, target);
      const recentVotes = GameState.interactionHistory.filter(e => e.type === 'VOTE' && e.actorId === target.id && e.targetId === actor.id).length;
      return alert * (0.22 + logic * 0.38) + grievance * 0.62 + pressure * (0.45 + logic * 0.35) + recentVotes * 14 - agreement * 0.18;
    }

    function getPartnerOf(playerId) {
      const pair = GameState.partnerships.find(pr => pr.aId === playerId || pr.bId === playerId);
      if (!pair) return null;
      const partnerId = pair.aId === playerId ? pair.bId : pair.aId;
      return getPlayerById(partnerId);
    }

    function canFormPartnership(idA, idB) {
      if (!idA || !idB || idA === idB) return false;
      const a = getPlayerById(idA);
      const b = getPlayerById(idB);
      if (!a || !b || !a.alive || !b.alive) return false;
      // 占い師同士（本物同士／CO済みの対抗を含む）は客観的に敵対するため協力不可。
      const aIsSeerSide = a.role.key === 'SEER' || a.claimedSeer;
      const bIsSeerSide = b.role.key === 'SEER' || b.claimedSeer;
      if (aIsSeerSide && bIsSeerSide) return false;
      return !getPartnerOf(idA) && !getPartnerOf(idB);
    }

    function formPartnership(idA, idB) {
      if (!canFormPartnership(idA, idB)) return false;
      GameState.partnerships.push({ aId: idA, bId: idB });
      return true;
    }

    function breakPartnership(playerId, reason = '状況変化') {
      const idx = GameState.partnerships.findIndex(pr => pr.aId === playerId || pr.bId === playerId);
      if (idx === -1) return null;
      const pair = GameState.partnerships[idx];
      const otherId = pair.aId === playerId ? pair.bId : pair.aId;
      GameState.partnerships.splice(idx, 1);
      return { brokenWithId: otherId, reason };
    }

    function hasDetectedLieAgainst(observer, targetId) {
      return GameState.detectedLies.some(d => d.observerId === observer.id && d.targetId === targetId);
    }

    /**

     * 4. CUT-IN & LOG RENDERERS

     */
    function triggerTurnCutIn(titleText, subText = '') {
      const overlay = document.getElementById('turnCutInOverlay');
      const card = document.getElementById('turnCutInCard');
      const titleEl = document.getElementById('turnCutInTitle');
      const subEl = document.getElementById('turnCutInSub');
      if (!overlay || !card || !titleEl) return;

      titleEl.textContent = titleText;
      if (subEl) {
        subEl.textContent = subText;
        subEl.classList.toggle('hidden', !subText);
      }

      overlay.classList.remove('hidden');
      card.classList.remove('turn-cutin-anim');
      void card.offsetWidth;
      card.classList.add('turn-cutin-anim');
      AudioEngine.playCutInChime('turn');

      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 2150);
    }

    function triggerLieCutIn(kickerText, mainText, detailText = '', durationMs = 1650) {
      const overlay = document.getElementById('lieCutInOverlay');
      const card = document.getElementById('lieCutInCard');
      const kickerEl = document.getElementById('lieCutInKicker');
      const mainEl = document.getElementById('lieCutInMain');
      const detailEl = document.getElementById('lieCutInDetail');
      if (!overlay || !card || !mainEl) return;

      if (kickerEl) kickerEl.textContent = kickerText || '';
      mainEl.textContent = mainText || '';
      if (detailEl) {
        detailEl.textContent = detailText || '';
        detailEl.classList.toggle('hidden', !detailText);
      }

      overlay.classList.remove('hidden');
      card.classList.remove('turn-cutin-anim');
      void card.offsetWidth;
      card.classList.add('turn-cutin-anim');
      AudioEngine.playCutInChime('turn');

      setTimeout(() => {
        overlay.classList.add('hidden');
      }, durationMs);
    }

    function showLieDiscoveryAbove(observer, speaker) {
      const seat = document.querySelector(`.round-seat[data-player-id="${CSS.escape(observer.id)}"]`);
      if (!seat) return;
      seat.querySelector('.lie-discovery-bubble')?.remove();
      const bubble = document.createElement('div');
      bubble.className = 'lie-discovery-bubble';
      bubble.textContent = `${speaker.name}の嘘に気づいた…`;
      bubble.style.cssText = 'position:absolute;z-index:80;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);width:max-content;max-width:190px;padding:6px 9px;border:1px solid #60a5fa;border-radius:7px;background:linear-gradient(135deg,#102b4c,#163d67);color:#dbeafe;font-size:10px;font-weight:800;box-shadow:0 4px 18px rgba(37,99,235,.28),0 4px 16px #0009;pointer-events:none;text-align:center;';
      seat.appendChild(bubble);
      AudioEngine.playCutInChime('turn');
      setTimeout(() => bubble.remove(), 2300);
    }

    function triggerEventCutIn(kicker, mainText, detailText = '', kind = 'info', durationMs = 2400) {
      const overlay = document.getElementById('eventCutInOverlay');
      const card = document.getElementById('eventCutInCard');
      const kickerEl = document.getElementById('eventCutInKicker');
      const mainEl = document.getElementById('eventCutInMain');
      const detailEl = document.getElementById('eventCutInDetail');
      if (!overlay || !card || !mainEl) return;

      if (kickerEl) kickerEl.textContent = kicker || '';
      mainEl.textContent = mainText || '';
      if (detailEl) {
        detailEl.textContent = detailText || '';
        detailEl.classList.toggle('hidden', !detailText);
      }

      card.classList.remove('border-amber-400/50', 'border-rose-500/60', 'border-cyan-400/60', 'border-emerald-400/60');
      if (kind === 'alert' || kind === 'exile') {
        card.classList.add('border-rose-500/60');
      } else if (kind === 'lie') {
        card.classList.add('border-cyan-400/60');
      } else if (kind === 'safe') {
        card.classList.add('border-emerald-400/60');
      } else {
        card.classList.add('border-amber-400/50');
      }

      overlay.classList.remove('hidden');
      card.classList.remove('event-cutin-anim');
      void card.offsetWidth;
      card.classList.add('event-cutin-anim');
      AudioEngine.playCutInChime(kind === 'alert' || kind === 'exile' ? 'alert' : 'turn');

      setTimeout(() => {
        overlay.classList.add('hidden');
      }, durationMs);
    }

    function pushLog(tag, text, color = '#94A3B8') {
      const logList = document.getElementById('eventLogList');
      if (!logList) return;
      const entry = document.createElement('div');

          <span class="h-2 w-2 rounded-xs shrink-0" style="background:${color}"></span>
          <span class="text-[10px] font-bold text-slate-300">${escapeHtml(tag)}</span>
        </div>
        <div class="text-slate-200 leading-snug">${escapeHtml(text)}</div>
      `;
      logList.prepend(entry);
      while (logList.children.length > 45) {
        logList.removeChild(logList.lastChild);

    function pushMonitorMessage(speakerPlayer, text, isReply = false) {

      const coTag = speakerPlayer && speakerPlayer.claimedSeer

        : '';

        ? `<span class="ml-1 rounded-xs bg-slate-800 px-1 text-[9px] text-slate-300">${escapeHtml(speakerPlayer.role.name)}</span>`

        <div class="flex items-center gap-1 mb-0.5">

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

          <circle cx="24" cy="17" r="9.5" fill="${color}" fill-opacity="0.28" stroke="${color}" stroke-width="2.2"/>
          <path d="M9 49C9 38.5 15.7 32 24 32C32.3 32 39 38.5 39 49" fill="${color}" fill-opacity="0.22" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/>

    function renderSeerResultsPanel() {
      const tbody = document.getElementById('seerResultsTbody');
      const count = document.getElementById('seerResultsCount');
      if (!tbody) return;

      const rows = [];
      (GameState.coSeerRecords || []).forEach(record => {
        const seer = getPlayerById(record.playerId);
        if (!seer) return;
        GameState.players.forEach(target => {
          (GameState.seerHistoryMap[target.id] || [])
            .filter(report => report.seerId === record.playerId)
            .forEach(report => rows.push({ seer, target, report }));
        });
      });
      rows.sort((a, b) => (a.report.day - b.report.day) || (a.report.turn - b.report.turn) ||
        a.seer.name.localeCompare(b.seer.name, 'ja'));

      if (count) count.textContent = `公表済み ${rows.length}件`;
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="py-3 text-center text-slate-500 italic">占い師CO・占い結果の公表後に、ここへ一覧表示されます。</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(({ seer, target, report }) => {
        const resultClass = report.isWolf
          ? 'border-rose-500/40 bg-rose-500/10 text-rose-200'
          : 'border-emerald-500/40 bg-emerald-500/10 text-emerald-200';
        const resultLabel = report.isWolf ? '人狼' : '人間';
        return `<tr>
          <td class="py-1.5 pr-2 whitespace-nowrap text-slate-400">${report.day}日目／${report.turn === 0 ? '朝' : `T${report.turn}`}</td>
          <td class="py-1.5 px-2 font-semibold text-slate-200 whitespace-nowrap">${escapeHtml(seer.name)}</td>
          <td class="py-1.5 px-2 text-slate-200 whitespace-nowrap">${escapeHtml(target.name)}</td>
          <td class="py-1.5 pl-2 text-right"><span class="inline-block rounded-xs border px-1.5 py-0.5 text-[10px] font-bold ${resultClass}">${resultLabel}</span></td>
        </tr>`;
      }).join('');
    }

        logic: 'ロジック', charisma: 'カリスマ', stealth: 'ステルス',

          .map(d => { const other = getPlayerById(d.observerId === p.id ? d.targetId : d.observerId); return `<div class="text-[10px] text-sky-200">${d.observerId === p.id ? '見抜いた' : '見抜かれた'}：${escapeHtml(other?.name || '不明')}</div>`; }).join('');
        const changes = GameState.parameterChangeLog.filter(e => e.actorId === p.id || e.targetId === p.id).slice(-8).reverse()
          .map(e => { const other = getPlayerById(e.actorId === p.id ? e.targetId : e.actorId); return `<div class="text-[10px] text-slate-300">${escapeHtml(other?.name || '不明')}：${escapeHtml(e.label)} ${e.delta > 0 ? '+' : ''}${e.delta}（${escapeHtml(e.reason)}）</div>`; }).join('');
        return `<div class="rounded border border-amber-500/30 bg-amber-950/15 p-3 space-y-1"><h3 class="text-xs font-black text-amber-200">神視点限定：内部情報</h3><div class="text-[10px] text-slate-200">役職：${escapeHtml(p.role.name)} ／ 陣営：${escapeHtml(p.role.team)}</div><div class="text-[10px] text-slate-300">行動原理：${principles}</div><div class="text-[10px] text-slate-300">対人パラメータ（警戒上位）</div>${dynamicRows}<div class="pt-1 text-[10px] font-bold text-slate-200">嘘の発見履歴</div>${recent || '<div class="text-[10px] text-slate-500">履歴なし</div>'}<div class="pt-1 text-[10px] font-bold text-slate-200">直近の数値変化</div>${changes || '<div class="text-[10px] text-slate-500">履歴なし</div>'}</div>`;
      })() : '';

      title.textContent = `${p.name} — キャラクター詳細`;
      content.innerHTML = `
        <div class="flex items-start gap-3 rounded border border-slate-800 bg-slate-900/70 p-3">
          <div class="h-12 w-12 shrink-0 rounded border border-slate-700 flex items-center justify-center text-xl font-black" style="color:${p.color}">${escapeHtml(p.name.slice(0,1))}</div>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-black text-white">${escapeHtml(p.name)}</span>

            <div class="mt-1 text-[11px] text-indigo-200">${partner ? `協力相手：${escapeHtml(partner.name)}` : '協力相手：なし'}</div>
          </div>
        </div>
        <div class="rounded border border-slate-800 p-3">
          <h3 class="mb-2 text-xs font-black text-sky-200">ステータス</h3>
          <div class="space-y-2">${statRows}</div>
        </div>
        ${godOnlyPanel}

          </div>
          <div class="rounded border border-rose-500/30 bg-rose-950/20 p-3">
            <div class="text-[11px] font-bold text-rose-200">仲の悪い相手</div>

      modal.classList.remove('hidden');

    function renderStageAndRoster(activeSpeakerId = null) {
      const alive = getAlivePlayers();
      const aliveBadge = document.getElementById('aliveCountBadge');
      if (aliveBadge) {
        aliveBadge.textContent = `生存: ${alive.length}/${GameState.players.length}`;
      }

      const partnerBadge = document.getElementById('partnershipCountBadge');
      if (partnerBadge) {
        if (GameState.partnerships.length > 0) {
          partnerBadge.classList.remove('hidden');
          partnerBadge.textContent = `協力組: ${GameState.partnerships.length}`;
        } else {
          partnerBadge.classList.add('hidden');
        }
      }

      const modeSub = document.getElementById('modeSubLabel');
      if (modeSub) {
        modeSub.textContent = GameState.viewMode === 'GOD' ? '神視点（全役職開示）' : '推理視点';
      }

      const centerPhase = document.getElementById('tableCenterPhase');
      const centerStatus = document.getElementById('tableCenterStatus');
      const centerSub = document.getElementById('tableCenterSub');
      if (centerPhase) centerPhase.textContent = `DAY ${GameState.day}`;
      if (centerStatus) {
        if (GameState.phase === 'MORNING') centerStatus.textContent = `Turn ${GameState.turn} / ${GameState.maxTurns}`;
        else if (GameState.phase === 'VOTING') centerStatus.textContent = '投票フェーズ';
        else if (GameState.phase === 'NIGHT') centerStatus.textContent = '夜の帳';
        else centerStatus.textContent = '終幕';
      }
      if (centerSub) {
        centerSub.textContent = `生存 ${alive.length}名`;
      }

      // Render round table seats
      const seatsLayer = document.getElementById('stageSeatsLayer');
      if (seatsLayer) {
        seatsLayer.innerHTML = '';
        const total = GameState.players.length;
        GameState.players.forEach((p, idx) => {
          const angle = -Math.PI / 2 + (idx / total) * Math.PI * 2;
          const rx = 40; // % horizontal radius
          const ry = 37; // % vertical radius
          const leftPct = 50 + rx * Math.cos(angle);
          const topPct = 50 + ry * Math.sin(angle);

          const isSpeaking = p.id === activeSpeakerId && p.alive;
          const partner = getPartnerOf(p.id);
          const isConfirmedHuman = GameState.confirmedHumanIds.includes(p.id);
          const isConfirmedEnemy = GameState.confirmedEnemyIds.includes(p.id);

          const seat = document.createElement('div');
          seat.className = `round-seat flex flex-col items-center ${!p.alive ? 'opacity-35 grayscale' : ''}`;
          seat.dataset.playerId = p.id;
          seat.style.left = `${leftPct}%`;
          seat.style.top = `${topPct}%`;

          const cardBox = document.createElement('div');
          cardBox.className = `relative w-12 sm:w-14 rounded-xs border px-1 py-1 bg-slate-950/95 shadow-md ${
            isSpeaking ? 'speaking-ring border-amber-300 scale-105' : 'border-slate-700/90'
          }`;
          cardBox.style.borderColor = isSpeaking ? '#FBBF24' : `${p.color}88`;
          cardBox.innerHTML = createSilhouetteSVG(p.color, 'w-7 h-8 sm:w-8 sm:h-9');

          if (p.claimedSeer) {
            const coBadge = document.createElement('span');
            coBadge.className = 'absolute -top-1.5 -left-1.5 rounded-xs border border-cyan-300/70 bg-cyan-950/95 px-1 text-[8px] font-black text-cyan-200 leading-tight z-10';
            coBadge.textContent = '占CO';
            cardBox.appendChild(coBadge);
          }

          if (isConfirmedHuman) {
            const hBadge = document.createElement('span');
            hBadge.className = 'absolute top-2 right-0 rounded-xs border border-emerald-400/70 bg-emerald-950/95 px-1 text-[7px] font-black text-emerald-200 leading-tight whitespace-nowrap z-10';
            hBadge.textContent = '絶対に人間';
            cardBox.appendChild(hBadge);
          }
          if (isConfirmedEnemy) {
            const eBadge = document.createElement('span');
            eBadge.className = `absolute ${isConfirmedHuman ? 'top-6' : 'top-2'} right-0 rounded-xs border border-rose-400/70 bg-rose-950/95 px-1 text-[7px] font-black text-rose-200 leading-tight whitespace-nowrap z-10`;
            eBadge.textContent = '絶対に敵';
            cardBox.appendChild(eBadge);
          }

          if (!p.alive) {
            const deadStamp = document.createElement('div');
            deadStamp.className = 'absolute inset-0 flex items-center justify-center bg-slate-950/70 text-[9px] font-black text-rose-300 tracking-wider';
            deadStamp.textContent = '退場';
            cardBox.appendChild(deadStamp);
          }

          const nameTag = document.createElement('div');
          nameTag.className = 'mt-0.5 w-full truncate text-center text-[10px] sm:text-[11px] font-bold leading-tight text-white';
          nameTag.style.color = p.alive ? '#F8FAFC' : '#94A3B8';
          nameTag.textContent = p.name;

          seat.appendChild(cardBox);
          seat.appendChild(nameTag);

          // 神視点、またはゲーム終了時のみ役職を名前の下に表示する。
          if (GameState.viewMode === 'GOD' || GameState.phase === 'ENDED') {
            const roleTag = document.createElement('div');
            roleTag.className = `mt-0.5 max-w-full truncate rounded-xs border px-1 text-[8px] font-bold ${p.role.badgeClass}`;
            roleTag.textContent = p.role.name;
            seat.appendChild(roleTag);
          }

          seat.classList.add('cursor-pointer');
          seat.title = 'クリックしてキャラクター詳細を確認';
          seat.addEventListener('click', () => openCharacterDetail(p.id));

          if (partner && p.alive) {
            const pTag = document.createElement('div');
            pTag.className = 'max-w-full truncate rounded-xs bg-indigo-950/90 border border-indigo-400/40 px-1 text-[8px] font-bold text-indigo-200 leading-tight mt-0.5';
            pTag.textContent = `協:${partner.name}`;
            seat.appendChild(pTag);
          }

          seatsLayer.appendChild(seat);
        });
      }

      // Render right-hand roster
      const rosterEl = document.getElementById('participantRoster');
      if (rosterEl) {
        rosterEl.innerHTML = '';
        GameState.players.forEach(p => {
          const isSpeaking = p.id === activeSpeakerId && p.alive;
          const partner = getPartnerOf(p.id);
          const item = document.createElement('div');
          item.className = `cursor-pointer flex items-center justify-between gap-2 rounded-xs border px-2.5 py-1.5 text-xs hover:border-sky-500/60 ${
            !p.alive
              ? 'border-slate-800/60 bg-slate-900/35 opacity-55'
              : isSpeaking
              ? 'border-amber-400/70 bg-amber-500/10'
              : 'border-slate-800/90 bg-slate-900/70'
          }`;

    /**
     * =========================================================================
     * 6. TYPEWRITER DIALOGUE ENGINE (1 CHAR AT A TIME + POPOPO)
     * =========================================================================
     */
    function clearTimers() {
      if (GameState.stepTimer) {
        clearTimeout(GameState.stepTimer);
        GameState.stepTimer = null;
      }
      if (GameState.typeTimer) {
        clearInterval(GameState.typeTimer);
        GameState.typeTimer = null;
      }
    }

    function playDialogueStep({
      speakerPlayer = null,
      speakerName = '',
      speakerColor = '#94A3B8',
      actionTag = '',
      hintText = '',
      text = '',
      baseHoldMs = 1700,
      onComplete = null
    }) {
      clearTimers();
      const token = ++GameState.activeStepToken;

      const nameRowWrap = document.getElementById('dialogueSpeakerDot')?.parentElement;
      const nameEl = document.getElementById('dialogueSpeakerName');
      const dotEl = document.getElementById('dialogueSpeakerDot');
      const coBadgeEl = document.getElementById('dialogueCoBadge');
      const tagEl = document.getElementById('dialogueActionTag');
      const bodyEl = document.getElementById('dialogueText');
      const hintEl = document.getElementById('dialogueHint');
      const barEl = document.getElementById('stepProgressBar');

      const hasSpeaker = Boolean(speakerName && speakerName.trim());
      if (nameRowWrap) {
        nameRowWrap.classList.toggle('hidden', !hasSpeaker);
      }
      if (nameEl) {
        nameEl.textContent = hasSpeaker ? speakerName : '';
        nameEl.style.color = speakerColor || '#F8FAFC';
      }
      if (dotEl) {
        dotEl.style.backgroundColor = speakerColor || '#94A3B8';
      }
      if (coBadgeEl) {
        coBadgeEl.classList.toggle('hidden', !(speakerPlayer && speakerPlayer.claimedSeer));
      }
      if (tagEl) {
        if (actionTag) {
          tagEl.textContent = actionTag;
          tagEl.classList.remove('hidden');
        } else {
          tagEl.textContent = '';
          tagEl.classList.add('hidden');
        }
      }
      if (hintEl) {
        if (hintText) {
          hintEl.textContent = hintText;
          hintEl.classList.remove('hidden');
        } else {
          hintEl.textContent = '';
          hintEl.classList.add('hidden');
        }
      }

      renderStageAndRoster(speakerPlayer && speakerPlayer.alive ? speakerPlayer.id : null);

      const fullText = String(text ?? '');
      if (bodyEl) bodyEl.textContent = '';

      const charIntervalMs = Math.max(12, Math.round(28 / GameState.speed));
      let idx = 0;

      if (barEl) {
        barEl.style.transition = 'none';
        barEl.style.width = '0%';
      }

      function scheduleNext() {
        if (token !== GameState.activeStepToken) return;
        const holdDuration = Math.max(1200, Math.round((5000 + Math.min(1400, fullText.length * 24)) / GameState.speed));
        if (barEl) {
          void barEl.offsetWidth;
          barEl.style.transition = `width ${holdDuration}ms linear`;
          barEl.style.width = '100%';
        }

        const waitStep = () => {
          if (token !== GameState.activeStepToken) return;
          if (GameState.paused) {
            GameState.stepTimer = setTimeout(waitStep, 180);
            return;
          }
          if (typeof onComplete === 'function') {
            onComplete();
          }
        };

        GameState.stepTimer = setTimeout(waitStep, holdDuration);
      }

      GameState.typeTimer = setInterval(() => {
        if (token !== GameState.activeStepToken) {
          clearInterval(GameState.typeTimer);
          return;
        }
        if (GameState.paused) return;

        if (idx < fullText.length) {
          const ch = fullText[idx];
          if (bodyEl) bodyEl.textContent += ch;
          if (hasSpeaker && idx % 2 === 0 && !/\s/.test(ch)) {
            const pitch = speakerPlayer ? (0.88 + (speakerPlayer.stats.cuteness / 100) * 0.28) : 1.0;
            AudioEngine.playPopo(pitch);
          }
          idx++;
        } else {
          clearInterval(GameState.typeTimer);
          GameState.typeTimer = null;
          scheduleNext();
        }
      }, charIntervalMs);
    }

    /**

    function startNewMatch() {
      clearTimers();
      if (GameState.monitorBanterTimer) {
        clearInterval(GameState.monitorBanterTimer);
        GameState.monitorBanterTimer = null;
      }

      const votePanel = document.getElementById('voteSummaryPanel');
      if (votePanel) votePanel.classList.add('hidden');

      const logList = document.getElementById('eventLogList');
      if (logList) logList.innerHTML = '';

      const monitorFeed = document.getElementById('monitorRoomFeed');
      if (monitorFeed) {
        monitorFeed.innerHTML = '<div class="text-slate-500 italic py-1">まだモニタールームに誰も入室していません。</div>';
      }

      GameState.day = 1;
      GameState.turn = 1;
      GameState.phase = 'MORNING';
      GameState.partnerships = [];
      GameState.coTurnUsed = false;
      GameState.coLockedForMatch = false;
      GameState.coSeerRecords = [];
      GameState.seerHistoryMap = {};
      GameState.confirmedHumanIds = [];
      GameState.confirmedEnemyIds = [];
      GameState.exiledTodayEnemyIds = [];
      GameState.detectedLies = [];
      GameState.voteHistory = [];
      GameState.nightHistory = [];
      GameState.currentVoteEntries = [];
      GameState.observerKnownFaction = {};
      GameState.statementSequence = 0;
      GameState.parameterChangeLog = [];
      GameState.lastChatterId = null;
      GameState.lastChatterJoinerId = null;
      GameState.lastChatterStopped = false;
      GameState.lastSuspectedMap = {};
      GameState.lastDefendedMap = {};
      GameState.lastGuardedId = null;

      // Pick 9 characters randomly from pool
      const selectedChars = shuffleArray(CHARACTER_POOL).slice(0, 9);

      // Assign roles for 9 players: 2 Wolves, 1 Seer, 1 Hunter, 1 Madman, 4 Villagers
      const roleDeck = shuffleArray([
        ROLES.WEREWOLF,
        ROLES.WEREWOLF,
        ROLES.SEER,
        ROLES.HUNTER,
        ROLES.MADMAN,
        ROLES.VILLAGER,
        ROLES.VILLAGER,
        ROLES.VILLAGER,
        ROLES.VILLAGER
      ]);

      GameState.players = selectedChars.map((ch, idx) => ({
        ...ch,
        seatIndex: idx,
        role: roleDeck[idx],
        alive: true,
        deathCause: '',
        claimedSeer: false,
        coTurn: null,
        seerChecks: [], // [{ targetId, isWolf, day }]
        alertness: Math.floor(25 + Math.random() * 25),
        consistency: Math.floor(65 + Math.random() * 25)
      }));

      // Initialize LOVE, trust, alertness matrices
      GameState.loveMatrix = {};
      GameState.trustMatrix = {};
      GameState.alertnessMatrix = {};
      GameState.grievanceMatrix = {};
      GameState.agreementMatrix = {};
      GameState.favorMatrix = {};
      GameState.interactionHistory = [];
      GameState.coCallDays = [];

      GameState.players.forEach(a => {
        GameState.loveMatrix[a.id] = {};
        GameState.trustMatrix[a.id] = {};
        GameState.alertnessMatrix[a.id] = {};
        GameState.grievanceMatrix[a.id] = {};
        GameState.agreementMatrix[a.id] = {};
        GameState.favorMatrix[a.id] = {};
        GameState.seerHistoryMap[a.id] = [];

        GameState.players.forEach(b => {
          if (a.id === b.id) return;
          let initLove = Math.floor(Math.random() * 26) - 8;
          // Character-specific relationship tendencies persist across every new loop.
          if (a.id === 'nana' && b.id === 'miva') initLove += 48;
          if (a.id === 'suikaku' && b.id === 'miva') initLove += 42;
          if (a.id === 'shinonome' && b.id === 'rimera') initLove += 48;
          if (a.id === 'shinonome' && (b.id === 'miva' || b.id === 'yukiha')) initLove -= 28;
          // Aldemern tends to have higher LOVE toward Shinonome and Rimera
          if (a.id === 'aldemern' && (b.id === 'shinonome' || b.id === 'rimera')) {
            initLove += 28;
          }
          // Wolves know each other and start with higher bond
          if (a.role.key === 'WEREWOLF' && b.role.key === 'WEREWOLF') {
            initLove = Math.max(initLove, 35);
          }
          GameState.loveMatrix[a.id][b.id] = Math.max(-100, Math.min(100, initLove));
          GameState.trustMatrix[a.id][b.id] = 50 + Math.floor(Math.random() * 14) - 7;
          GameState.alertnessMatrix[a.id][b.id] = 20 + Math.floor(Math.random() * 16);
          GameState.grievanceMatrix[a.id][b.id] = 0;
          GameState.agreementMatrix[a.id][b.id] = 0;
          GameState.favorMatrix[a.id][b.id] = 0;
        });
      });

      const matchBadge = document.getElementById('matchCounterBadge');
      if (matchBadge) matchBadge.textContent = `第${GameState.matchNumber}戦`;

      pushLog('開戦', `第${GameState.matchNumber}戦が開幕（参加者: ${selectedChars.map(c => c.name).join('、')}）`, '#FBBF24');

      // Start periodic monitor room banter
      GameState.monitorBanterTimer = setInterval(() => {
        if (GameState.paused) return;
        triggerMonitorRoomBanter();
      }, 6500);

      AudioEngine.setBgmPhase('MORNING');
      beginMorningDay(1);
    }

    function chooseSeerTarget(seer, pool) {
      if (!pool.length) return null;
      const logic = (seer.stats.logic || 0) / 100;
      const loveFocus = !!seer.bias?.loveFocus;
      return [...pool].map(target => {
        const suspicion = getAlertness(seer, target);
        const trust = getTrust(seer, target);
        const love = getLove(seer, target);
        const charisma = target.stats.charisma || 0;
        const intuition = target.stats.intuition || 0;
        let score = suspicion * (0.35 + logic * 0.9) + (100 - trust) * (0.15 + logic * 0.35);
        score += charisma * (0.08 + logic * 0.22) + intuition * 0.08;
        if (loveFocus) score += -love * 0.72;
        else score += -love * (0.08 + logic * 0.12);
        if (seer.bias?.highLoveTowardMiva && target.id === 'miva') score -= 28;
        if (seer.bias?.protectTrusted && love > 35) score -= 18;
        score += Math.random() * (loveFocus ? 42 : 24);
        return { target, score };
      }).sort((a, b) => b.score - a.score)[0].target;
    }

    function chooseFakeSeerReport(seer, pool) {
      if (!pool.length) return null;
      const isWolf = seer.role.key === 'WEREWOLF';
      const logic = (seer.stats.logic || 0) / 100;
      const loveFocus = !!seer.bias?.loveFocus;
      const target = [...pool].map(candidate => {
        const love = getLove(seer, candidate);
        const suspicion = getAlertness(seer, candidate);
        const personallyDetectedWolfLie = seer.role.key === 'MADMAN' && hasDetectedLieAgainst(seer, candidate.id) && candidate.role.key === 'WEREWOLF';
        const influence = candidate.stats.charisma || 0;
        let score = suspicion * (0.18 + logic * 0.45) + influence * (0.12 + logic * 0.42);
        if (loveFocus) score += -love * 0.9;
        else score += -love * 0.12;
        // A wolf can safely whitewash an ally; a madman instead relies on social signals.
        if (isWolf && candidate.role.key === 'WEREWOLF') score -= 180;
        // A Madman who intuitively caught this wolf's lie will favor reporting them as human.
        if (personallyDetectedWolfLie) score += 260;
        if (seer.bias?.usesLoveStrategically && love > 45) score -= 12;
        score += Math.random() * (loveFocus ? 48 : 30);
        return { target: candidate, score };
      }).sort((a, b) => b.score - a.score)[0].target;

      const love = getLove(seer, target);
      const suspicion = getAlertness(seer, target);
      const influence = target.stats.charisma || 0;
      let blackScore = 28 + suspicion * (0.22 + logic * 0.4) + influence * (0.12 + logic * 0.38);
      let whiteScore = 38 + (100 - suspicion) * 0.16;
      if (isWolf && target.role.key === 'WEREWOLF') whiteScore += 220;
      else if (isWolf) blackScore += 18 + logic * 24;
      if (seer.role.key === 'MADMAN' && hasDetectedLieAgainst(seer, target.id) && target.role.key === 'WEREWOLF') whiteScore += 320;
      if (loveFocus) {
        whiteScore += love * 0.78;
        blackScore -= love * 0.42;
      } else {
        whiteScore += love * 0.08;
        blackScore -= love * 0.06;
      }
      // Strategic liars may protect a powerful ally or frame a socially vulnerable rival.
      if (logic >= 0.75 && target.role.key !== 'WEREWOLF') {
        blackScore += influence * 0.18 + suspicion * 0.12;
        whiteScore += influence * 0.08;
      }
      let reportedWolf = blackScore + Math.random() * 35 > whiteScore + Math.random() * 35;
      // A fake claimant must never publish the target's actual alignment as its result.
      // The character's strategic preference selects the target and preferred framing;
      // if that framing happens to be true, invert it so the report remains a lie.
      if (reportedWolf === (target.role.key === 'WEREWOLF')) reportedWolf = !reportedWolf;
      return { target, isWolf: reportedWolf };
    }

    function performNightSeerChecks(dayNumber) {
      const seers = GameState.players.filter(p => p.alive && p.role.key === 'SEER');
      seers.forEach(seer => {
        const alreadyCheckedIds = new Set(seer.seerChecks.map(c => c.targetId));
        const candidates = getAlivePlayers().filter(p => p.id !== seer.id && !alreadyCheckedIds.has(p.id));
        const pool = candidates.length > 0 ? candidates : getAlivePlayers().filter(p => p.id !== seer.id);
        const chosen = chooseSeerTarget(seer, pool);
        if (!chosen) return;
        seer.seerChecks.push({ targetId: chosen.id, isWolf: chosen.role.key === 'WEREWOLF', day: dayNumber });
      });
    }

    function canClaimSeerNow(player) {
      if (!player || !player.alive) return false;
      if (player.claimedSeer) return false;
      if (GameState.coLockedForMatch) return false;
      // Only SEER, MADMAN, or WEREWOLF can claim Seer; VILLAGER and HUNTER never claim Seer
      if (!['SEER', 'MADMAN', 'WEREWOLF'].includes(player.role.key)) return false;

      // Max 3 total claimers: at most 1 true SEER, 1 MADMAN, 1 WEREWOLF
      const currentClaimers = GameState.coSeerRecords;
      if (currentClaimers.length >= 3) return false;

      const sameRoleCount = currentClaimers.filter(r => r.trueRoleKey === player.role.key).length;
      if (sameRoleCount >= 1) return false;

      // Two wolves know each other: if one wolf already claimed Seer, the other wolf will not claim Seer
      if (player.role.key === 'WEREWOLF') {
        const wolfAlreadyClaimed = currentClaimers.some(r => r.trueRoleKey === 'WEREWOLF');
        if (wolfAlreadyClaimed) return false;
      }

      return true;
    }

    function executeSeerClaim(player) {
      if (!canClaimSeerNow(player)) return null;
      player.claimedSeer = true;
      player.coTurn = GameState.turn;
      GameState.coTurnUsed = true;

      // Pick a target to report on (prefer someone not yet reported by this claimer)
      const existingRecord = GameState.coSeerRecords.find(r => r.playerId === player.id);
      const alreadyReportedIds = new Set(existingRecord ? existingRecord.targets.map(t => t.targetId) : []);
      const aliveOthers = getAlivePlayers().filter(p => p.id !== player.id && !alreadyReportedIds.has(p.id));
      const pool = aliveOthers.length > 0 ? aliveOthers : getAlivePlayers().filter(p => p.id !== player.id);

      let target = null;
      let reportedWolf = false;

      if (pool.length > 0 && GameState.day >= 2) {
        if (player.role.key === 'SEER') {
          const latestCheck = [...player.seerChecks].reverse().find(c => pool.some(p => p.id === c.targetId));
          if (latestCheck) {
            target = getPlayerById(latestCheck.targetId);
            reportedWolf = latestCheck.isWolf;
          } else {
            target = pool[Math.floor(Math.random() * pool.length)];
            reportedWolf = target.role.key === 'WEREWOLF';
          }
        } else {
          const fakeReport = chooseFakeSeerReport(player, pool);
          if (fakeReport) {
            target = fakeReport.target;
            reportedWolf = fakeReport.isWolf;
          }
        }
      }

      const verdictLabel = reportedWolf ? '黒（人狼）' : '白（人間）';
      const resultText = target ? `${target.name}を占い、結果は「${verdictLabel}」だった。` : '';

      let rec = existingRecord;
      if (!rec) {
        rec = {
          playerId: player.id,
          trueRoleKey: player.role.key,
          coDay: GameState.day,
          coTurn: GameState.turn,
          targets: []
        };
        GameState.coSeerRecords.push(rec);
      }

      if (target) {
        rec.targets.push({ targetId: target.id, isWolf: reportedWolf, day: GameState.day });
        if (!GameState.seerHistoryMap[target.id]) GameState.seerHistoryMap[target.id] = [];
        GameState.seerHistoryMap[target.id].push({
          seerId: player.id,
          isWolf: reportedWolf,
          day: GameState.day,
          turn: GameState.turn
        });

        // If reported black, target suspects this claimer immediately
        if (reportedWolf && target.alive) {
          adjustAlertness(target, player, 55);
          adjustTrust(target, player, -40);
          GameState.lastSuspectedMap[player.id] = target.id;
        }
      }

      recomputeConfirmedPlayers();

      return {
        actor: player,
        target,
        actionType: 'CO_SEER',
        tagText: target ? `占い師CO → ${target.name}（${reportedWolf ? '黒' : '白'}）` : '占い師CO',
        line: getCharacterLine(player, 'CO_SEER', target, { resultText }),
        godHint: `${player.name}（${player.role.name}）が占い師CO（${target ? target.name + ':' + verdictLabel : ''}）`,
        deductionHint: `${player.name}が占い師CO${target ? `（${target.name}＝${verdictLabel}）` : ''}`
      };
    }

    function getExposedSeerClaimantIds() {
      const exposedIds = new Set();
      (GameState.coSeerRecords || []).forEach(record => {
        const accusedWasAttacked = GameState.players.some(attackedPlayer => {
          if (attackedPlayer.deathCause !== '襲撃') return false;
          return (GameState.seerHistoryMap[attackedPlayer.id] || []).some(report =>
            report.seerId === record.playerId && report.isWolf === true
          );
        });
        if (accusedWasAttacked) exposedIds.add(record.playerId);
      });
      return exposedIds;
    }

    function getInferredGenuineSeerId(exposedIds = getExposedSeerClaimantIds()) {
      // Public rule: if exactly one person claimed Seer on Day 1, that claimant is
      // treated as the genuine Seer. If several claimed together, all but the sole
      // claimant not exposed by a disproven black result must be exposed first.
      const dayOneClaimers = (GameState.coSeerRecords || []).filter(record => record.coDay === 1);
      if (dayOneClaimers.length === 1) {
        return exposedIds.has(dayOneClaimers[0].playerId) ? null : dayOneClaimers[0].playerId;
      }
      if (dayOneClaimers.length < 2) return null;

      const remaining = dayOneClaimers.filter(record => !exposedIds.has(record.playerId));
      return remaining.length === 1 ? remaining[0].playerId : null;
    }

    function getLogicalCertaintyCandidates() {
      const claimedRecords = GameState.coSeerRecords || [];
      const humanIds = new Set();
      const enemyIds = new Set();
      if (claimedRecords.length === 0) return { humanIds, enemyIds };

      const exposedIds = getExposedSeerClaimantIds();
      exposedIds.forEach(id => enemyIds.add(id));
      const genuineSeerId = getInferredGenuineSeerId(exposedIds);
      // Day 1 has a single exposed Seer claimant and CO is locked for the match:
      // under this game's public rule, that claimant is logically non-Werewolf.
      const dayOneClaimers = claimedRecords.filter(record => record.coDay === 1);
      if (dayOneClaimers.length === 1 && !exposedIds.has(dayOneClaimers[0].playerId)) {
        humanIds.add(dayOneClaimers[0].playerId);
      }

      GameState.players.forEach(player => {
        const reportsBySeer = claimedRecords.map(record => ({
          seerId: record.playerId,
          reports: (GameState.seerHistoryMap[player.id] || [])
            .filter(report => report.seerId === record.playerId)
        }));

        // Once a genuine Seer is inferred from public claim history, their results
        // alone are authoritative. This includes results announced before the
        // counter-claimants were exposed.
        if (genuineSeerId) {
          const genuineReports = (GameState.seerHistoryMap[player.id] || [])
            .filter(report => report.seerId === genuineSeerId);
          if (genuineReports.length > 0) {
            if (genuineReports.every(report => report.isWolf === genuineReports[0].isWolf)) {
              if (genuineReports[0].isWolf) enemyIds.add(player.id);
              else humanIds.add(player.id);
            }
            return;
          }
        }

        // If the genuine Seer has not reported on this target, every claimant on
        // the field must have reported, and all published results must agree.
        // This consensus rule also works before the genuine Seer is identifiable.
        const everySeerReported = reportsBySeer.length >= 2 &&
          reportsBySeer.every(entry => entry.reports.length > 0);
        if (!everySeerReported) return;

        const eachSeerAgreesInternally = reportsBySeer.every(entry =>
          entry.reports.every(report => report.isWolf === entry.reports[0].isWolf)
        );
        if (!eachSeerAgreesInternally) return;

        const unanimousResult = reportsBySeer[0].reports[0].isWolf;
        const allSeersAgree = reportsBySeer.every(entry => entry.reports[0].isWolf === unanimousResult);
        if (!eachSeerAgreesInternally || !allSeersAgree) return;

        if (unanimousResult) enemyIds.add(player.id);
        else humanIds.add(player.id);
      });

      // A MADMAN may correctly be classified as both non-Werewolf (human result)
      // and opposing faction (enemy). Keep the two sets independent.
      return { humanIds, enemyIds };
    }

    function recomputeConfirmedPlayers() {
      // Evidence only creates eligibility. Public certainty is established later,
      // when a high-logic character actually performs the corresponding action.
      const candidates = getLogicalCertaintyCandidates();

      // If later information invalidates the evidence, remove the public marker.
      // A Day-1 unique claimant or the sole unexposed Day-1 claimant is authoritative.
      GameState.confirmedHumanIds = (GameState.confirmedHumanIds || [])
        .filter(id => candidates.humanIds.has(id));
      GameState.confirmedEnemyIds = (GameState.confirmedEnemyIds || [])
        .filter(id => candidates.enemyIds.has(id));
    }
    /**
     * =========================================================================
     * 9. LIE DETECTION & ACTION SELECTION ENGINE
     * =========================================================================
     */
    function checkLieDetectionCutIn(speaker, actionType, statement = '') {
      // Only the deceptive factions generate detectable lies in the current rules.
      if (!speaker || !['WEREWOLF', 'MADMAN'].includes(speaker.role.key)) return [];
      const statementId = `D${GameState.day}-T${GameState.turn}-S${++GameState.statementSequence}`;
      const observers = getAlivePlayers().filter(o => o.id !== speaker.id);
      const discoveries = [];
      for (const obs of observers) {
        // A character may notice different lies from the same speaker on different turns.
        if (GameState.detectedLies.some(d => d.observerId === obs.id && d.statementId === statementId)) continue;
        const intuition = Math.max(0, Math.min(100, Number(obs.stats?.intuition || 0))) / 100;
        const acting = Math.max(0, Math.min(100, Number(speaker.stats?.acting || 0))) / 100;
        const coLie = actionType === 'CO_SEER';
        let chance = (coLie ? 0.30 : 0.12) * (0.45 + intuition * 1.35) * (1.30 - acting * 0.82);
        if (obs.bias?.logicHeavy) chance *= 0.92;
        if (obs.bias?.impulsive || obs.bias?.questionsQuickly) chance *= 1.10;
        if (obs.bias?.defendsOften) chance *= 0.78;
        chance = Math.max(0.015, Math.min(0.72, chance));
        if (Math.random() >= chance) continue;

        const reason = coLie ? '役職COの違和感' : '発言内容の違和感';
        const record = { observerId: obs.id, targetId: speaker.id, statementId, actionType, reason, day: GameState.day, turn: GameState.turn };
        GameState.detectedLies.push(record);
        discoveries.push({ observer: obs, speaker, record });
        if (!GameState.observerKnownFaction[obs.id]) GameState.observerKnownFaction[obs.id] = {};
        GameState.observerKnownFaction[obs.id][speaker.id] = obs.role.key === 'MADMAN' ? 'WEREWOLF' : 'WOLF_FACTION';

        if (obs.role.key === 'MADMAN' && speaker.role.key === 'WEREWOLF') {
          adjustLove(obs, speaker, 22, '狂人が人狼の嘘を見抜き、味方として認識');
          adjustTrust(obs, speaker, 25, '狂人が人狼の嘘を見抜き、味方として認識');
        } else {
          adjustAlertness(obs, speaker, 24, '嘘を見抜いた');
          adjustTrust(obs, speaker, -18, '嘘を見抜いた');
        }
      }
      return discoveries;
    }

    function chooseTurnAction(actor) {
      const alive = getDiscussionPlayers();
      if (!alive.some(p => p.id === actor.id)) return null;
      const others = alive.filter(p => p.id !== actor.id);
      if (others.length === 0) return null;

      const isHighLogic = actor.stats.logic >= 75;
      const isLowLogic = actor.stats.logic <= 45;

      // 1. 協力相手が「絶対に敵」と指摘された場合、協力者本人が次の自分のターンを消費して協力破棄を申し出る。
      const currentPartner = getPartnerOf(actor.id);
      if (currentPartner && GameState.confirmedEnemyIds.includes(currentPartner.id)) {
        breakPartnership(actor.id, '協力相手が絶対に敵と判定');
        return {
          actor,
          target: currentPartner,
          actionType: 'PARTNER_BREAK',
          tagText: `協力破棄 → ${currentPartner.name}`,
          line: getCharacterLine(actor, 'PARTNER_BREAK', currentPartner),
          godHint: `${actor.name}が絶対に敵と指摘された${currentPartner.name}に協力破棄を申し出た`,
          deductionHint: `${actor.name}が${currentPartner.name}に協力破棄を申し出た`
        };
      }

      // 通常の協力解消条件
      if (currentPartner) {
        const trustWithP = getTrust(actor, currentPartner);
