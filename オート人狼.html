        const alertWithP = getAlertness(actor, currentPartner);
        const bothClaimedSeer = (actor.role.key === 'SEER' || actor.claimedSeer) &&
          (currentPartner.role.key === 'SEER' || currentPartner.claimedSeer);
        if (bothClaimedSeer || trustWithP < 26 || alertWithP > 65 || (Math.random() < 0.08 && trustWithP < 42)) {
          breakPartnership(actor.id, '状況変化');
          return {
            actor,
            target: currentPartner,
            actionType: 'PARTNER_BREAK',
            tagText: `協力解消 → ${currentPartner.name}`,
            line: getCharacterLine(actor, 'PARTNER_BREAK', currentPartner),
            godHint: `${actor.name}が${currentPartner.name}との協力関係を解消`,
            deductionHint: `${actor.name}が${currentPartner.name}との協力を解消した`
          };
        }
      }

      // 2. High-logic characters can publicly point out logically certain players.
      // The evidence alone does not create a public label; this action consumes the actor's turn.
      if (isHighLogic) {
        const certaintyCandidates = getLogicalCertaintyCandidates();
        const dayOneClaimers = (GameState.coSeerRecords || []).filter(r => r.coDay === 1);
        const uniqueClaimantId = dayOneClaimers.length === 1 ? dayOneClaimers[0].playerId : null;
        const canAssertUniqueClaimant = Boolean(uniqueClaimantId && certaintyCandidates.humanIds.has(uniqueClaimantId) && !GameState.confirmedHumanIds.includes(uniqueClaimantId));
        if (!canAssertUniqueClaimant && Math.random() >= 0.82) { /* retain normal action variety */ } else {

        const enemyTargetIds = [...certaintyCandidates.enemyIds].filter(id => {
          const pl = getPlayerById(id);
          return pl && pl.alive && pl.id !== actor.id && !GameState.confirmedEnemyIds.includes(id);
        });
        const humanTargetIds = [...certaintyCandidates.humanIds].filter(id => {
          const pl = getPlayerById(id);
          return pl && pl.alive && pl.id !== actor.id && !GameState.confirmedHumanIds.includes(id);
        });

        // If both kinds of certainty are available, either kind may be pointed out.
        const availableKinds = [];
        if (enemyTargetIds.length > 0) availableKinds.push('ENEMY');
        if (humanTargetIds.length > 0) availableKinds.push('HUMAN');
        const selectedKind = canAssertUniqueClaimant && humanTargetIds.includes(uniqueClaimantId)
          ? 'HUMAN'
          : (availableKinds.length > 0 ? availableKinds[Math.floor(Math.random() * availableKinds.length)] : null);

        if (selectedKind === 'ENEMY') {
          const target = enemyTargetIds.map(id => getPlayerById(id)).filter(Boolean).sort((a,b) => getPersonalThreatScore(actor, b) - getPersonalThreatScore(actor, a))[0];
          if (target) {
            if (!GameState.confirmedEnemyIds.includes(target.id)) GameState.confirmedEnemyIds.push(target.id);
            // 協力関係はここでは維持。協力者本人が次の自分のターンに協力破棄を申し出る。
            return {
              actor,
              target,
              actionType: 'CERTAIN_ENEMY',
              tagText: `絶対に敵だ → ${target.name}`,
              line: getCharacterLine(actor, 'CERTAIN_ENEMY', target),
              godHint: `${actor.name}が${target.name}を「絶対に敵だ」と指摘（${target.role.name}）`,
              deductionHint: `${actor.name}が${target.name}を「絶対に敵だ」と指摘`
            };
          }
        } else if (selectedKind === 'HUMAN') {
          const target = humanTargetIds.map(id => getPlayerById(id)).filter(Boolean).sort((a,b) => getTrust(actor, b) - getTrust(actor, a))[0];
          if (target) {
            if (!GameState.confirmedHumanIds.includes(target.id)) GameState.confirmedHumanIds.push(target.id);
            return {
              actor,
              target,
              actionType: 'CERTAIN_HUMAN',
              tagText: `絶対に人間だ → ${target.name}`,
              line: getCharacterLine(actor, 'CERTAIN_HUMAN', target),
              godHint: `${actor.name}が${target.name}を「絶対に人間だ」と指摘（${target.role.name}）`,
              deductionHint: `${actor.name}が${target.name}を「絶対に人間だ」と指摘`
            };
          }
        }
        }
      }
      // 3. "名乗り出ろ": High charisma characters can call CO if no CO has occurred in any prior turn and CO is not locked.
      // True SEER themselves cannot use "名乗り出ろ" (true SEER uses "名乗り出る").
      if (
        actor.stats.charisma >= 70 &&
        actor.role.key !== 'SEER' &&
        !GameState.coTurnUsed &&
        !GameState.coLockedForMatch &&
        GameState.coSeerRecords.length === 0 &&
        !GameState.coCallDays.includes(GameState.day) &&
        Math.random() < (GameState.day === 1 ? 0.72 : 0.30)
      ) {
        GameState.coTurnUsed = true;
        GameState.coCallDays.push(GameState.day);
        return {
          actor,
          target: null,
          actionType: 'CALL_CO',
          tagText: '名乗り出ろ',
          line: getCharacterLine(actor, 'CALL_CO', null),
          godHint: `${actor.name}（${actor.role.name}）が占い師COを促した`,
          deductionHint: `${actor.name}が占い師に名乗り出るよう呼びかけた`
        };
      }

      // 4. Direct Seer CO ("名乗り出る"): allowed only if no CO occurred in a prior turn and not locked
      if (
        !GameState.coTurnUsed &&
        !GameState.coLockedForMatch &&
        canClaimSeerNow(actor) &&
        Math.random() < (GameState.day === 1 ? (actor.role.key === 'SEER' ? 0.68 : 0.28) : (actor.role.key === 'SEER' ? 0.34 : 0.16))
      ) {
        return executeSeerClaim(actor);
      }

      // 5. Partnership proposal ("協力しよう") if neither actor nor target is in a partnership
      if (!getPartnerOf(actor.id) && Math.random() < 0.16) {
        const freeTargets = others.filter(
          o => !getPartnerOf(o.id) && canFormPartnership(actor.id, o.id) && getLove(actor, o) >= -10
        );
        if (freeTargets.length > 0) {
          const target = freeTargets.sort((a, b) => {
            const score = p => getLove(actor, p) * 0.52 + getTrust(actor, p) * 0.28 +
              getRelationValue('agreementMatrix', actor, p) * 0.75 +
              getRelationValue('favorMatrix', actor, p) * 0.32 -
              getRelationValue('grievanceMatrix', actor, p) * 0.42;
            return score(b) - score(a);
          })[0];
          return {
            actor,
            target,
            actionType: 'PARTNER_ASK',
            tagText: `協力しよう → ${target.name}`,
            line: getCharacterLine(actor, 'PARTNER_ASK', target),
            godHint: `${actor.name}（${actor.role.name}）が${target.name}（${target.role.name}）に協力を打診`,
            deductionHint: `${actor.name}が${target.name}に協力を持ちかけた`
          };
        }
      }

      // 6. Chitchat ("雑談する")
      if (Math.random() < 0.22) {
        GameState.lastChatterId = actor.id;
        GameState.lastChatterJoinerId = null;
        GameState.lastChatterStopped = false;
        return {
          actor,
          target: null,
          actionType: 'CHITCHAT',
          tagText: '雑談する',
          line: getCharacterLine(actor, 'CHITCHAT', null),
          godHint: `${actor.name}（${actor.role.name}）が雑談を始めた`,
          deductionHint: `${actor.name}が雑談を始めた`
        };
      }

      // 7. Suspect: combine public evidence, debate history, relationships and personality.
      const suspectPool = others.filter(o => !(actor.role.team === 'VILLAGE' && GameState.confirmedHumanIds.includes(o.id)));
      const pool = suspectPool.length > 0 ? suspectPool : others;
      const target = [...pool].map(candidate => {
        const blackMarked = (GameState.seerHistoryMap[actor.id] || []).some(r => r.seerId === candidate.id && r.isWolf);
        const detectedLie = hasDetectedLieAgainst(actor, candidate.id);
        const love = getLove(actor, candidate);
        const trust = getTrust(actor, candidate);
        const logic = (actor.stats.logic || 0) / 100;
        const agreement = getRelationValue('agreementMatrix', actor, candidate);
        const grievance = getRelationValue('grievanceMatrix', actor, candidate);
        const affectionTowardActor = getLove(candidate, actor);
        const recentPressure = getPersonalThreatScore(actor, candidate);
        const consistencyPenalty = Math.max(0, 100 - (candidate.consistency || 70));
        const credibleVote = GameState.voteHistory.some(dayVote => dayVote.votes.some(v =>
          v.voterId === candidate.id && (GameState.confirmedEnemyIds.includes(v.targetId) ||
            (GameState.seerHistoryMap[actor.id] || []).some(r => r.seerId === v.targetId && r.isWolf))
        ));
        let score = recentPressure * (0.42 + logic * 0.45);
        if (credibleVote && actor.stats.logic >= 60) score -= 16 + actor.stats.logic * 0.12;
        score += (100 - trust) * (0.12 + logic * 0.32);
        score += consistencyPenalty * (0.08 + logic * 0.42);
        score += blackMarked ? 95 + logic * 55 : 0;
        score += detectedLie ? 48 + (actor.stats.intuition || 0) * 0.22 : 0;
        score += grievance * 0.45;
        score -= agreement * (actor.bias?.defendsOften ? 0.72 : 0.32);
        score += actor.bias?.loveFocus ? -love * 0.82 : -love * (0.08 + logic * 0.18);
        if (actor.bias?.defendsOften && love > 25) score -= love * 0.25;
        if (actor.bias?.usesLoveStrategically) score -= Math.max(0, affectionTowardActor) * 0.34;
        if (actor.bias?.provokesOften) score += Math.random() * 18;
        score += Math.random() * (actor.bias?.loveFocus ? 24 : 16);
        return { target: candidate, score };
      }).sort((a, b) => b.score - a.score)[0].target;

      GameState.lastSuspectedMap[target.id] = actor.id;
      adjustAlertness(actor, target, 12);
      return {
        actor, target, actionType: 'SUSPECT', tagText: `疑う → ${target.name}`,
        line: getCharacterLine(actor, 'SUSPECT', target),
        godHint: `${actor.name}（${actor.role.name}）が${target.name}（${target.role.name}）を疑った`,
        deductionHint: `${actor.name}が${target.name}を疑った`
      };
    }

    function buildFollowUpActions(mainAction) {
      const followUps = [];
      const alive = getDiscussionPlayers();
      const actor = mainAction.actor;

      // Handle CALL_CO: Seer may stay hidden to avoid attack unless a fake Seer counters; fake Seers counter-claim
      if (mainAction.actionType === 'CALL_CO') {
        const responders = shuffleArray(alive.filter(p => p.id !== actor.id && canClaimSeerNow(p)));
        const fakeResponders = responders.filter(p => p.role.key !== 'SEER');
        const trueSeerResponder = responders.find(p => p.role.key === 'SEER');

        let fakeCOAdded = false;
        fakeResponders.forEach(resp => {
          const someoneAlreadyCO = GameState.coSeerRecords.length > 0 || followUps.some(f => f.actionType === 'CO_SEER');
          const prob = someoneAlreadyCO ? 0.65 : 0.24;
          if (Math.random() < prob && followUps.length < 3) {
            const coAct = executeSeerClaim(resp);
            if (coAct) {
              followUps.push(coAct);
              fakeCOAdded = true;
            }
          }
        });

        if (trueSeerResponder && followUps.length < 3) {
          const fakeAlreadyClaimed =
            fakeCOAdded || GameState.coSeerRecords.some(r => r.trueRoleKey !== 'SEER');
          if (fakeAlreadyClaimed || Math.random() < 0.48) {
            const coAct = executeSeerClaim(trueSeerResponder);
            if (coAct) followUps.push(coAct);
          }
        }
        return followUps;
      }

      // Handle CO_SEER: Counter-claimers may chain in the same turn; true Seer must counter if fake claimed
      if (mainAction.actionType === 'CO_SEER') {
        const counters = shuffleArray(alive.filter(p => p.id !== actor.id && canClaimSeerNow(p)));
        counters.forEach(c => {
          const mustTrueSeerCounter = c.role.key === 'SEER' && actor.role.key !== 'SEER';
          const prob = mustTrueSeerCounter ? 1.0 : c.role.key === 'MADMAN' ? 0.55 : 0.35;
          if (Math.random() < prob && followUps.length < 2) {
            const coAct = executeSeerClaim(c);
            if (coAct) followUps.push(coAct);
          }
        });
        return followUps;
      }

      // Handle PARTNER_BREAK: the former partner's immediate reaction is retained in the dialogue.
      // This is a reaction to the offer, not a new discussion turn for the confirmed enemy.
      if (mainAction.actionType === 'PARTNER_BREAK' && mainAction.target && mainAction.target.alive) {
        const target = mainAction.target;
        followUps.push({
          actor: target,
          target: actor,
          actionType: 'PARTNER_DECLINE',
          tagText: `協力破棄への反応 → ${actor.name}`,
          line: getCharacterLine(target, 'PARTNER_DECLINE', actor),
          godHint: `${target.name}が${actor.name}からの協力破棄に反応`,
          deductionHint: `${target.name}が協力破棄に反応した`
        });
        return followUps;
      }

      // Handle PARTNER_ASK: target accepts or declines
      if (mainAction.actionType === 'PARTNER_ASK' && mainAction.target && mainAction.target.alive) {
        const target = mainAction.target;
        const love = getLove(target, actor);
        const trust = getTrust(target, actor);
        const agreement = getRelationValue('agreementMatrix', target, actor);
        const favor = getRelationValue('favorMatrix', target, actor);
        const grievance = getRelationValue('grievanceMatrix', target, actor);
        const acceptProb = Math.max(0.10, Math.min(0.92,
          0.42 + love * 0.0045 + (trust - 50) * 0.005 + agreement * 0.004 + favor * 0.003 - grievance * 0.003));
        if (canFormPartnership(actor.id, target.id) && Math.random() < acceptProb) {
          formPartnership(actor.id, target.id);
          followUps.push({
            actor: target,
            target: actor,
            actionType: 'PARTNER_ACCEPT',
            tagText: `協力承諾 → ${actor.name}`,
            line: getCharacterLine(target, 'PARTNER_ACCEPT', actor),
            godHint: `${target.name}が${actor.name}との協力を承諾`,
            deductionHint: `${target.name}が${actor.name}の協力を受け入れた`
          });
        } else {
          followUps.push({
            actor: target,
            target: actor,
            actionType: 'PARTNER_DECLINE',
            tagText: `協力辞退 → ${actor.name}`,
            line: getCharacterLine(target, 'PARTNER_DECLINE', actor),
            godHint: `${target.name}が${actor.name}の協力を断った`,
            deductionHint: `${target.name}が${actor.name}の協力を断った`
          });
        }
        return followUps;
      }

      // Handle CERTAIN_HUMAN / CERTAIN_ENEMY: keep the immediate reaction as part of the accusation scene.
      if ((mainAction.actionType === 'CERTAIN_HUMAN' || mainAction.actionType === 'CERTAIN_ENEMY') && mainAction.target && mainAction.target.alive) {
        const t = mainAction.target;
        const isEnemy = mainAction.actionType === 'CERTAIN_ENEMY';
        const reactKind = t.stats.charisma >= 75 ? 'ANGER' : 'ACCEPTANCE';
        followUps.push({
          actor: t,
          target: actor,
          actionType: isEnemy ? 'ENEMY_REACT' : 'HUMAN_REACT',
          tagText: isEnemy ? `絶対に敵への反応 → ${actor.name}` : `絶対に人間への反応 → ${actor.name}`,
          line: getCharacterLine(t, isEnemy ? 'ENEMY_REACT' : 'HUMAN_REACT', actor, { reactKind }),
          godHint: `${t.name}（${t.role.name}）が指摘に反応`,
          deductionHint: `${t.name}が反応を示した`
        });
        return followUps;
      }

      // Handle CHITCHAT or JOIN_CHITCHAT: mostly join chitchat; rarely stop chitchat
      if (mainAction.actionType === 'CHITCHAT' || mainAction.actionType === 'JOIN_CHITCHAT') {
        const candidates = shuffleArray(alive.filter(p => p.id !== actor.id));
        for (const cand of candidates) {
          // Occasional stop chitchat (~9% chance, only if not already stopped)
          if (!GameState.lastChatterStopped && cand.stats.logic >= 60 && Math.random() < 0.09) {
            GameState.lastChatterStopped = true;
            cand.alertness = Math.min(100, cand.alertness + 8);
            followUps.push({
              actor: cand,
              target: actor,
              actionType: 'STOP_CHITCHAT',
              tagText: `雑談を止める → ${actor.name}`,
              line: getCharacterLine(cand, 'STOP_CHITCHAT', actor),
              godHint: `${cand.name}が${actor.name}の雑談を止めた`,
              deductionHint: `${cand.name}が雑談の流れを止めた`
            });
            break;
          }

          // Join chitchat (~42% chance)
          if (Math.random() < 0.42) {
            cand.alertness = Math.max(5, cand.alertness - 6);
            GameState.lastChatterJoinerId = cand.id;
            followUps.push({
              actor: cand,
              target: actor,
              actionType: 'JOIN_CHITCHAT',
              tagText: `雑談に便乗する → ${actor.name}`,
              line: getCharacterLine(cand, 'JOIN_CHITCHAT', actor),
              godHint: `${cand.name}が${actor.name}の雑談に便乗`,
              deductionHint: `${cand.name}が雑談に便乗した`
            });
            if (followUps.length >= 2) break;
          }
        }
        return followUps;
      }

      // Handle SUSPECT: denial switches the discussion to a defense chain.
      // Every participant can speak only once in this turn.
      if (mainAction.actionType === 'SUSPECT' && mainAction.target && mainAction.target.alive) {
        const suspectTarget = mainAction.target;
        const spokenIds = new Set([actor.id, suspectTarget.id]);
        const getAvailableCandidates = () =>
          shuffleArray(getDiscussionPlayers().filter(p => !spokenIds.has(p.id)));

        const addFollowUp = (cand, actionType, tagLabel) => {
          spokenIds.add(cand.id);
          if (actionType === 'DEFEND') {
            GameState.lastDefendedMap[suspectTarget.id] = cand.id;
          }
          followUps.push({
            actor: cand,
            target: suspectTarget,
            actionType,
            tagText: `${tagLabel} → ${suspectTarget.name}`,
            line: getCharacterLine(cand, actionType === 'DEFEND_JOIN' ? 'DEFEND' : actionType, suspectTarget),
            godHint: actionType === 'DENY_SUSPICION'
              ? `${cand.name}が疑いを否定`
              : `${cand.name}が${suspectTarget.name}${actionType === 'AGREE_SUSPECT' ? 'への疑いに同調' : 'を弁護'}`,
            deductionHint: actionType === 'DENY_SUSPICION'
              ? `${cand.name}が疑いを否定した`
              : `${cand.name}が${suspectTarget.name}${actionType === 'AGREE_SUSPECT' ? 'への疑いに同調した' : 'を弁護した'}`
          });
        };

        // Specialized reactions replace the ordinary denial/defense path.
        // Once an agreement chain begins, denial and defense are intentionally locked out.
        const specialAction = (() => {
          if (suspectTarget.stats.intuition >= 60 &&
              (hasDetectedLieAgainst(suspectTarget, actor.id) || suspectTarget.role.team === 'WOLF') && Math.random() < 0.58) return 'BULLY_BACK';
          if (suspectTarget.stats.logic >= 50 && suspectTarget.stats.acting >= 50 && Math.random() < 0.38) return 'COUNTER_ATTACK';
          if (suspectTarget.stats.acting >= 60 && Math.random() < 0.34) return 'SEEK_HELP';
          if (suspectTarget.stats.cuteness >= 50 && Math.random() < (0.12 + suspectTarget.stats.cuteness * 0.0045)) return 'SAD_REACTION';
          if (suspectTarget.stats.stealth >= 50 && Math.random() < 0.36) return 'DEFLECT';
          return null;
        })();

        const addSpecialReaction = (who, target, type, label, lineType = type) => {
          spokenIds.add(who.id);
          followUps.push({ actor: who, target, actionType: type, tagText: `${label} → ${target.name}`,
            line: getCharacterLine(who, lineType, target),
            godHint: `${who.name}が${target.name}に${label}`,
            deductionHint: `${who.name}が${target.name}に${label}` });
        };

        if (specialAction === 'BULLY_BACK' || specialAction === 'COUNTER_ATTACK') {
          const type = specialAction;
          addSpecialReaction(suspectTarget, actor, type, type === 'BULLY_BACK' ? '騙されるな' : '反撃する');
          // 反撃の直後は、周囲が反撃側への疑いに同調することだけを許可。
          const chance = type === 'BULLY_BACK' ? 0.38 : 0.42;
          if (Math.random() < chance) {
            const joiner = getAvailableCandidates()[0];
            if (joiner) addSpecialReaction(joiner, actor, 'AGREE_SUSPECT', '疑いに同調する');
          }
          return followUps;
        }

        if (specialAction === 'SEEK_HELP') {
          const partner = getPartnerOf(suspectTarget.id);
          const helpers = getDiscussionPlayers().filter(p => p.id !== suspectTarget.id && p.id !== actor.id);
          const helper = (partner && helpers.includes(partner)) ? partner : helpers.sort((a,b) =>
            (getTrust(suspectTarget, b) + getLove(suspectTarget, b)) - (getTrust(suspectTarget, a) + getLove(suspectTarget, a))
          )[0];
          if (helper) addSpecialReaction(suspectTarget, helper, 'SEEK_HELP', '助けを求める');
          if (helper) {
            const accept = Math.min(0.92, Math.max(0.12, 0.42 + getTrust(helper, suspectTarget) * 0.003 + getLove(helper, suspectTarget) * 0.003 + (partner?.id === helper.id ? 0.22 : 0)));
            if (Math.random() < accept) {
              addSpecialReaction(helper, suspectTarget, 'DEFEND', '弁護する');
              // 弁護が成立した後だけ、別の参加者が弁護に加わる。
              const joiner = getAvailableCandidates()[0];
              if (joiner && Math.random() < 0.36 + Math.max(0, getLove(joiner, suspectTarget)) * 0.002) addSpecialReaction(joiner, suspectTarget, 'DEFEND_JOIN', '弁護に同調する');
            } else addSpecialReaction(helper, suspectTarget, 'DECLINE_HELP', '断る');
          }
          return followUps;
        }

        if (specialAction === 'SAD_REACTION') {
          addSpecialReaction(suspectTarget, actor, 'SAD_REACTION', '哀しむ');
          const candidates = getAvailableCandidates();
          const defender = candidates.sort((a,b) => (getLove(a, suspectTarget) + a.stats.cuteness) - (getLove(b, suspectTarget) + b.stats.cuteness)).reverse()[0];
          if (defender) {
            const defendChance = Math.min(0.88, 0.18 + suspectTarget.stats.cuteness * 0.0055 + Math.max(0, getLove(defender, suspectTarget)) * 0.002);
            if (Math.random() < defendChance) {
              addSpecialReaction(defender, suspectTarget, 'DEFEND', '弁護する');
              const joiner = getAvailableCandidates()[0];
              if (joiner && Math.random() < 0.30 + Math.max(0, getLove(joiner, suspectTarget)) * 0.002) addSpecialReaction(joiner, suspectTarget, 'DEFEND_JOIN', '弁護に同調する');
              adjustTrust(actor, suspectTarget, 5 + Math.round(suspectTarget.stats.cuteness * 0.05), '哀しむ姿を見て疑った側の信頼が揺らいだ');
              adjustLove(actor, suspectTarget, 2, '哀しむ姿に心を動かされた');
            }
          }
          return followUps;
        }

        if (specialAction === 'DEFLECT') {
          addSpecialReaction(suspectTarget, actor, 'DEFLECT', 'うやむやにする');
          adjustAlertness(suspectTarget, actor, -5, '話題を逸らして緊張を緩和');
          return followUps;
        }

        // Whether the accused denies is still probabilistic, as in the previous version.
        const denied = Math.random() < 0.55;
        if (denied) {
          addFollowUp(suspectTarget, 'DENY_SUSPICION', '疑いを否定');
          // Once the accused denies, suspicion-agreement is no longer eligible.
          // Other players may defend, and further players may join that defense.
          while (true) {
            const candidates = getAvailableCandidates();
            if (candidates.length === 0) break;
            const cand = candidates[0];
            const partner = getPartnerOf(cand.id);
            const partnerBonus = partner && partner.id === suspectTarget.id ? 0.15 : 0;
            const loveBonus = Math.max(0, getLove(cand, suspectTarget)) * 0.001;
            const sameFactionBonus = cand.role.key === 'WEREWOLF' && suspectTarget.role.key === 'WEREWOLF' ? (cand.bias?.defendsOften ? 0.32 : 0.18) : 0;
            const favorBonus = getRelationValue('favorMatrix', cand, suspectTarget) * 0.0015;
            const joinChance = Math.min(0.90, 0.28 + partnerBonus + loveBonus + sameFactionBonus + favorBonus);
            if (Math.random() >= joinChance) break;
            addFollowUp(cand, 'DEFEND_JOIN', '弁護に加わる');
          }
        } else {
          // Without a denial, the first response can either agree with the suspicion
          // or defend the accused. The chosen response then chains only its own type.
          const candidates = getAvailableCandidates();
          if (candidates.length > 0) {
            const cand = candidates[0];
            const partner = getPartnerOf(cand.id);
            const partnerBonus = partner && partner.id === actor.id ? 0.25 : 0;
            const loveWithSuspect = getLove(cand, suspectTarget);
            const sameFactionBonus = cand.role.key === 'WEREWOLF' && suspectTarget.role.key === 'WEREWOLF' ? (cand.bias?.defendsOften ? 0.42 : 0.24) : 0;
            const relationDefense = getRelationValue('favorMatrix', cand, suspectTarget) * 0.004;
            const defendChance = Math.min(0.88,
              (loveWithSuspect >= 25 ? 0.28 + Math.max(0, loveWithSuspect) * 0.002 : 0) +
              (cand.bias?.defendsOften ? 0.18 : 0) + sameFactionBonus + relationDefense);
            const agreeChance = Math.min(0.78, 0.32 + partnerBonus + getRelationValue('agreementMatrix', cand, actor) * 0.002);

            let chainType = null;
            if (Math.random() < defendChance) {
              chainType = 'DEFEND';
              addFollowUp(cand, 'DEFEND', '弁護する');
            } else if (Math.random() < agreeChance) {
              chainType = 'AGREE_SUSPECT';
              addFollowUp(cand, 'AGREE_SUSPECT', '疑いに同調する');
            }

            if (chainType === 'DEFEND') {
              while (true) {
                const nextCandidates = getAvailableCandidates();
                if (nextCandidates.length === 0) break;
                const next = nextCandidates[0];
                const partnerNext = getPartnerOf(next.id);
                const partnerBonusNext = partnerNext && partnerNext.id === suspectTarget.id ? 0.15 : 0;
                const loveBonusNext = Math.max(0, getLove(next, suspectTarget)) * 0.001;
                const sameFactionBonusNext = next.role.key === 'WEREWOLF' && suspectTarget.role.key === 'WEREWOLF' ? (next.bias?.defendsOften ? 0.32 : 0.18) : 0;
                const favorBonusNext = getRelationValue('favorMatrix', next, suspectTarget) * 0.0015;
                const joinChance = Math.min(0.90, 0.28 + partnerBonusNext + loveBonusNext + sameFactionBonusNext + favorBonusNext);
                if (Math.random() >= joinChance) break;
                addFollowUp(next, 'DEFEND_JOIN', '弁護に加わる');
              }
            } else if (chainType === 'AGREE_SUSPECT') {
              while (true) {
                const nextCandidates = getAvailableCandidates();
                if (nextCandidates.length === 0) break;
                const next = nextCandidates[0];
                const partnerNext = getPartnerOf(next.id);
                const partnerBonusNext = partnerNext && partnerNext.id === actor.id ? 0.25 : 0;
                const agreeChanceNext = Math.min(0.78, 0.32 + partnerBonusNext);
                if (Math.random() >= agreeChanceNext) break;
                addFollowUp(next, 'AGREE_SUSPECT', '疑いに同調する');
              }
            }
          }
        }
      }

      return followUps;
    }

    /**
     * =========================================================================
     * 10. MORNING PHASE & TURN PROGRESSION
     * =========================================================================
     */
    function beginMorningDay(dayNum) {
      GameState.day = dayNum;
      GameState.turn = 1;
      GameState.phase = 'MORNING';
      GameState.coTurnUsed = false;
      GameState.exiledTodayEnemyIds = [];

      const phaseBadge = document.getElementById('permanentPhaseBadge');
      const turnLabel = document.getElementById('permanentTurnLabel');
      const phaseSub = document.getElementById('permanentPhaseSub');
      if (phaseBadge) phaseBadge.textContent = `DAY ${dayNum}`;
      if (turnLabel) turnLabel.textContent = `Turn 1`;
      if (phaseSub) phaseSub.textContent = '朝の議論フェーズ';

      AudioEngine.setBgmPhase('MORNING');
      triggerTurnCutIn(`DAY ${dayNum} — TURN 1`, '朝の議論開始');

      // Day 1 has no divination results. From Day 2 onward, every living claimant
      // publishes exactly one result at the start of the morning, in claimant order.
      const seerReportSteps = [];
      if (dayNum >= 2) {
        GameState.coSeerRecords.forEach(rec => {
          const seerPlayer = getPlayerById(rec.playerId);
          if (!seerPlayer || !seerPlayer.alive) return;

          let report = null;
          if (seerPlayer.role.key === 'SEER') {
            const check = seerPlayer.seerChecks.find(chk => chk.day === dayNum - 1 &&
              !rec.targets.some(t => t.targetId === chk.targetId && t.day === dayNum));
            if (check) report = { target: getPlayerById(check.targetId), isWolf: check.isWolf };
          } else {
            const alreadyReportedToday = rec.targets.some(t => t.day === dayNum);
            if (!alreadyReportedToday) {
              const reportedIds = new Set(rec.targets.map(t => t.targetId));
              const fresh = getAlivePlayers().filter(p => p.id !== seerPlayer.id && !reportedIds.has(p.id));
              const pool = fresh.length ? fresh : getAlivePlayers().filter(p => p.id !== seerPlayer.id);
              report = chooseFakeSeerReport(seerPlayer, pool);
            }
          }

          if (!report || !report.target) return;
          const tgt = report.target;
          const reportedWolf = report.isWolf;
          rec.targets.push({ targetId: tgt.id, isWolf: reportedWolf, day: dayNum });
          if (!GameState.seerHistoryMap[tgt.id]) GameState.seerHistoryMap[tgt.id] = [];
          GameState.seerHistoryMap[tgt.id].push({
            seerId: seerPlayer.id,
            isWolf: reportedWolf,
            day: dayNum,
            turn: 0
          });
          if (reportedWolf && tgt.alive) {
            adjustAlertness(tgt, seerPlayer, 55);
            adjustTrust(tgt, seerPlayer, -40);
          }
          const verdictLabel = reportedWolf ? '黒（人狼）' : '白（人間）';
          seerReportSteps.push({
            actor: seerPlayer,
            target: tgt,
            actionType: 'CO_SEER',
            tagText: `占い結果公表 → ${tgt.name}（${reportedWolf ? '黒' : '白'}）`,
            line: getCharacterLine(seerPlayer, 'CO_SEER', tgt, { resultText: `${tgt.name}を占い、結果は「${verdictLabel}」だった。` }),
            godHint: `朝一番の占い結果：${seerPlayer.name}が${tgt.name}を${verdictLabel}と報告`,
            deductionHint: `${seerPlayer.name}が${tgt.name}の占い結果（${verdictLabel}）を公表`
          });
        });
      }

      recomputeConfirmedPlayers();

      if (seerReportSteps.length > 0) {
        runStepQueue(seerReportSteps, () => {
          runMorningTurn(1);
        });
      } else {
        runMorningTurn(1);
      }
    }

    function runMorningTurn(turnNum) {
      if (checkVictoryCondition()) return;

      GameState.turn = turnNum;
      GameState.phase = 'MORNING';
      GameState.coTurnUsed = false;

      const turnLabel = document.getElementById('permanentTurnLabel');
      const phaseSub = document.getElementById('permanentPhaseSub');
      if (turnLabel) turnLabel.textContent = `Turn ${turnNum}`;
      if (phaseSub) phaseSub.textContent = `朝の議論（${turnNum}/${GameState.maxTurns}）`;

      if (turnNum > 1) {
        triggerTurnCutIn(`TURN ${turnNum}`, `DAY ${GameState.day} 議論続行`);
      }

      const alive = getAlivePlayers();
      const discussionPlayers = getDiscussionPlayers();
      if (alive.length <= 1 || discussionPlayers.length === 0) {
        startVotingPhase();
        return;
      }

      const speaker = discussionPlayers[Math.floor(Math.random() * discussionPlayers.length)];
      const mainAction = chooseTurnAction(speaker);
      if (!mainAction) {
        advanceAfterTurn();
        return;
      }

      // Build same-turn counterclaims before locking CO for subsequent turns.
      const followUps = buildFollowUpActions(mainAction);
      if (mainAction.actionType === 'CO_SEER' || followUps.some(fu => fu.actionType === 'CO_SEER')) {
        GameState.coLockedForMatch = true;
      }
      followUps.forEach(fu => {
        if (fu.actionType === 'CO_SEER') {
          GameState.coLockedForMatch = true;
        }
      });

      const queue = [mainAction, ...followUps];
      queue.forEach(recordPublicAction);
      runStepQueue(queue, () => {
        // Show brief scene transition ellipsis without speaker/tag before advancing
        playDialogueStep({
          speakerPlayer: null,
          speakerName: '',
          actionTag: '',
          hintText: '',
          text: '……',
          baseHoldMs: 950,
          onComplete: () => {
            advanceAfterTurn();
          }
        });
      });
    }

    function runStepQueue(steps, onDone) {
      if (!steps || steps.length === 0) {
        if (typeof onDone === 'function') onDone();
        return;
      }

      const [current, ...rest] = steps;
      const hint = GameState.viewMode === 'GOD' ? (current.godHint || '') : (current.deductionHint || '');
      pushLog(current.tagText || '発言', `${current.actor.name}：${current.line}`, current.actor.color);

      playDialogueStep({
        speakerPlayer: current.actor,
        speakerName: current.actor.name,
        speakerColor: current.actor.color,
        actionTag: current.tagText || '',
        hintText: hint,
        text: current.line,
        baseHoldMs: 1650,
        onComplete: () => {
          const discoveries = checkLieDetectionCutIn(current.actor, current.actionType, current.line);
          if (discoveries.length > 0) {
            const showNext = (index) => {
              if (index >= discoveries.length) { runStepQueue(rest, onDone); return; }
              const item = discoveries[index];
              showLieDiscoveryAbove(item.observer, item.speaker);
              setTimeout(() => showNext(index + 1), 420);
            };
            showNext(0);
          } else {
            runStepQueue(rest, onDone);
          }
        }
      });
    }

    function advanceAfterTurn() {
      if (checkVictoryCondition()) return;
      if (GameState.turn < GameState.maxTurns) {
        runMorningTurn(GameState.turn + 1);
      } else {
        startVotingPhase();
      }
    }

    /**
     * =========================================================================
     * 11. VOTING PHASE (SUMMARY TABLE + EXILED CUT-IN + PARTING LINE)
     * =========================================================================
     */
    function startVotingPhase() {
      if (checkVictoryCondition()) return;

      GameState.phase = 'VOTING';
      AudioEngine.setBgmPhase('VOTING');

      const phaseBadge = document.getElementById('permanentPhaseBadge');
      const turnLabel = document.getElementById('permanentTurnLabel');
      const phaseSub = document.getElementById('permanentPhaseSub');
      if (phaseBadge) phaseBadge.textContent = `DAY ${GameState.day}`;
      if (turnLabel) turnLabel.textContent = '投票';
      if (phaseSub) phaseSub.textContent = '追放投票フェーズ';

      renderStageAndRoster(null);

      const alive = getAlivePlayers();
      if (alive.length <= 1) {
        startNightPhase();
        return;
      }

      const voteEntries = [];
      const tallyMap = {};
      alive.forEach(p => { tallyMap[p.id] = 0; });

      // Determine each voter's choice
      alive.forEach(voter => {
        const candidates = alive.filter(t => t.id !== voter.id);
        let chosen = null;

        // 「絶対に敵」は強い投票材料だが、固定確率で強制しない。
        // ロジック・警戒・嘘検知・占い結果に加え、LOVE重視や陣営の勝利戦略も反映する。
        // 「絶対に人間」は強い保護情報だが、占い結果が白の狂人もあり得るため候補からは除外しない。
        const pool = candidates;

        const voteScore = (target) => {
          const isConfirmedEnemy = GameState.confirmedEnemyIds.includes(target.id);
          const isConfirmedHuman = GameState.confirmedHumanIds.includes(target.id);
          const blackMarked = (GameState.seerHistoryMap[voter.id] || []).some(r => r.seerId === target.id && r.isWolf);
          const alertness = getAlertness(voter, target);
          const love = getLove(voter, target);
          const detectedLie = hasDetectedLieAgainst(voter, target.id);
          const logicFactor = voter.stats.logic / 100;
          let score = 0;

          // 高ロジックほど「絶対に敵」の意味を正しく理解し、投票優先度を高める。
          if (isConfirmedEnemy) score += 28 + logicFactor * 105;
          if (isConfirmedHuman && voter.role.team === 'VILLAGE') {
            const genuineSeerId = getInferredGenuineSeerId();
            // 真占い師と確定した人物はより強く保護。白判定だけなら狂人の余地を残す。
            score -= target.id === genuineSeerId ? (78 + logicFactor * 38) : (48 + logicFactor * 24);
          }
          if (blackMarked) score += 35 + logicFactor * 105;
          if (detectedLie) score += 18 + voter.stats.intuition * 0.42;
          score += alertness * (0.18 + logicFactor * 0.58);
          score += getPersonalThreatScore(voter, target) * (0.18 + logicFactor * 0.24);
          score += getRelationValue('grievanceMatrix', voter, target) * 0.24;
          score -= getRelationValue('agreementMatrix', voter, target) * (voter.bias?.defendsOften ? 0.55 : 0.22);
          score -= getRelationValue('favorMatrix', voter, target) * 0.20;
          if (voter.bias?.usesLoveStrategically) score -= Math.max(0, getLove(target, voter)) * 0.38;

          // LOVE重視の性格は、敵判定よりも個人的な好悪を優先する場合がある。
          if (voter.bias?.loveFocus) score += -love * 1.05;
          else score += -love * (voter.stats.logic <= 45 ? 0.42 : 0.16);

          // 人狼陣営は同陣営（人狼・狂人）への投票を避け、村側の追放を狙う。
          // ただし低ロジックほど盤面理解が弱く、確定情報を活用しにくい。
          if (voter.role.team === 'WOLF') {
            const strategicWeight = 0.25 + logicFactor * 0.75;
            if (target.role.team === 'WOLF') {
              const allyPressure = getPersonalThreatScore(voter, target) + getAlertness(voter, target);
              const sacrificeAlly = GameState.confirmedEnemyIds.includes(target.id) || allyPressure > 82;
              score -= (sacrificeAlly ? 13 : 55) * strategicWeight;
              if (sacrificeAlly) score += 20 * strategicWeight; // 仲間を切り捨てて自分の生存を優先
              if (getLove(voter, target) > 55 && !sacrificeAlly) score -= 10;
            } else score += 16 * strategicWeight;
            // 終盤は勝利条件を優先し、票を逸らす動きが強まる。
            const livingWolves = alive.filter(p => p.role.team === 'WOLF').length;
            const livingVillage = alive.length - livingWolves;
            if (livingWolves >= livingVillage) {
              if (target.role.team === 'VILLAGE') score += 24 * strategicWeight;
              if (target.role.team === 'WOLF') score -= 30 * strategicWeight;
            }
          } else if (isConfirmedEnemy) {
            // 村側は基本的に敵へ向かうが、低ロジック・LOVE重視なら逸れる余地を残す。
            score += 12 * logicFactor;
          }

          return score + Math.random() * (voter.bias?.loveFocus ? 52 : (voter.stats.logic <= 45 ? 46 : 28));
        };

        chosen = pool.map(target => ({ target, score: voteScore(target) }))
          .sort((a, b) => b.score - a.score)[0].target;

        tallyMap[chosen.id] = (tallyMap[chosen.id] || 0) + 1;
        voteEntries.push({ voter, target: chosen });
        GameState.interactionHistory.push({ day: GameState.day, turn: GameState.turn, actorId: voter.id, targetId: chosen.id, type: 'VOTE' });
        // 投票された側は、ロジックやLOVEの傾向に応じて投票者への反発を蓄積する。
        adjustLove(chosen, voter, -(chosen.bias?.loveFocus ? 8 : (chosen.stats.logic >= 60 ? 5 : 2)), '自分への投票に反発');
        changeRelationValue('grievanceMatrix', chosen, voter, chosen.stats.logic >= 60 ? 8 + chosen.stats.logic * 0.035 : (chosen.bias?.loveFocus ? 2 : 4));
        if (voter.role.team === 'WOLF' && chosen.role.team === 'WOLF') changeRelationValue('grievanceMatrix', voter, chosen, 5);
      });

      // Find highest voted player
      const sortedByVotes = [...alive].sort((a, b) => {
        const diff = (tallyMap[b.id] || 0) - (tallyMap[a.id] || 0);
        if (diff !== 0) return diff;
        return Math.random() - 0.5;
      });
      const exiled = sortedByVotes[0];
      const maxVotes = tallyMap[exiled.id] || 0;
      GameState.currentVoteEntries = voteEntries.map(e => ({ voterId: e.voter.id, targetId: e.target.id }));
      GameState.voteHistory.push({ day: GameState.day, votes: GameState.currentVoteEntries.slice(), tally: { ...tallyMap }, exiledId: exiled.id });

      // Render summary vote table below message window
      const panel = document.getElementById('voteSummaryPanel');
      const tbody = document.getElementById('voteSummaryTbody');
      const badge = document.getElementById('voteExiledSummaryBadge');

      if (tbody) {
        tbody.innerHTML = '';
        voteEntries.forEach(ve => {
          const tr = document.createElement('tr');
          const isTargetExiled = ve.target.id === exiled.id;
          tr.innerHTML = `
            <td class="py-1.5 pr-2 font-bold" style="color:${ve.voter.color}">${escapeHtml(ve.voter.name)}</td>
            <td class="py-1.5 px-2 font-bold ${isTargetExiled ? 'text-rose-300' : 'text-slate-200'}">${escapeHtml(ve.target.name)}</td>
            <td class="py-1.5 pl-2 text-right font-black ${isTargetExiled ? 'text-rose-300' : 'text-slate-400'}">${tallyMap[ve.target.id]}票</td>
          `;
          tbody.appendChild(tr);
        });
      }
      if (badge) {
        badge.textContent = `追放: ${exiled.name}（${maxVotes}票）`;
      }
      if (panel) {
        panel.classList.remove('hidden');
      }

      // Cut-in highlight of exiled player
      triggerEventCutIn(
        `DAY ${GameState.day} 投票結果`,
        `${exiled.name} が追放された`,
        `得票数: ${maxVotes}票`,
        'exile',
        2400
      );

      exiled.alive = false;
      exiled.deathCause = '追放';
      pushLog('追放', `${exiled.name}（${maxVotes}票）が投票により追放された`, '#F43F5E');
      pushMonitorMessage(exiled, `${exiled.name}がモニタールームに入室した。`, false);

      const partingLine = getExilePartingLine(exiled, exiled.role.key === 'WEREWOLF' ? 'ANGER' : 'ACCEPTANCE');
      pushLog('遺言', `${exiled.name}：${partingLine}`, exiled.color);

      playDialogueStep({
        speakerPlayer: exiled,
        speakerName: exiled.name,
        speakerColor: exiled.color,
        actionTag: `追放決定（${maxVotes}票）`,
        hintText: GameState.viewMode === 'GOD' ? `役職: ${exiled.role.name}` : '',
        text: partingLine,
        baseHoldMs: 2400,
        onComplete: () => {
          if (panel) panel.classList.add('hidden');
          if (!checkVictoryCondition()) {
            startNightPhase();
          }
        }
      });
    }

    /**
     * =========================================================================
     * 12. NIGHT PHASE (HUNTER GUARD + WOLF ATTACK + CUT-IN)
     * =========================================================================
     */
    function startNightPhase() {
      if (checkVictoryCondition()) return;

      GameState.phase = 'NIGHT';
      AudioEngine.setBgmPhase('NIGHT');

      const phaseBadge = document.getElementById('permanentPhaseBadge');
      const turnLabel = document.getElementById('permanentTurnLabel');
      const phaseSub = document.getElementById('permanentPhaseSub');
      if (phaseBadge) phaseBadge.textContent = `DAY ${GameState.day}`;
      if (turnLabel) turnLabel.textContent = '夜';
      if (phaseSub) phaseSub.textContent = '夜の行動フェーズ';

      renderStageAndRoster(null);

      // Perform night seer checks for dawn
      performNightSeerChecks(GameState.day);

      // Hunter guard choice (cannot guard self)
      const hunter = getAlivePlayers().find(p => p.role.key === 'HUNTER');
      let guardedId = null;
      if (hunter) {
        const guardPool = getAlivePlayers().filter(p => p.id !== hunter.id);
        if (guardPool.length > 0) {
          const isHighLogic = hunter.stats.logic >= 75;
          const chosenGuard = [...guardPool].sort((a, b) => {
            const confA = GameState.confirmedHumanIds.includes(a.id) ? 60 : 0;
            const confB = GameState.confirmedHumanIds.includes(b.id) ? 60 : 0;
            const scoreA = isHighLogic
              ? confA + getTrust(hunter, a) * 0.8 + Math.random() * 20
              : getLove(hunter, a) * 1.1 + Math.random() * 20;
            const scoreB = isHighLogic
              ? confB + getTrust(hunter, b) * 0.8 + Math.random() * 20
              : getLove(hunter, b) * 1.1 + Math.random() * 20;
            return scoreB - scoreA;
          })[0];
          guardedId = chosenGuard.id;
        }
      }
      GameState.lastGuardedId = guardedId;

      // Wolf attack choice: aggregate each living wolf's strategic and personal motives.
      const wolves = getAlivePlayers().filter(p => p.role.key === 'WEREWOLF');
      const attackPool = getAlivePlayers().filter(p => p.role.key !== 'WEREWOLF');
      let victim = null;
      if (wolves.length > 0 && attackPool.length > 0) {
        const attackScore = (wolf, target) => {
          const logic = (wolf.stats.logic || 0) / 100;
          const love = getLove(wolf, target);
          const affectionTowardWolf = getLove(target, wolf);
          const alert = getAlertness(wolf, target);
          const trust = getTrust(wolf, target);
          const pressureOnWolf = getPersonalThreatScore(wolf, target);
          const targetHasVotedWolf = GameState.interactionHistory.some(e => e.type === 'VOTE' && e.actorId === target.id && e.targetId === wolf.id);
          const targetHasSuspectedWolf = GameState.interactionHistory.some(e => ['SUSPECT','CERTAIN_ENEMY'].includes(e.type) && e.actorId === target.id && e.targetId === wolf.id);
          const targetHasSuspectedAlly = wolves.some(ally => GameState.interactionHistory.some(e => ['SUSPECT','CERTAIN_ENEMY'].includes(e.type) && e.actorId === target.id && e.targetId === ally.id));
          const claimedSeer = target.claimedSeer; // 未COの本物占い師の正体は人狼にも見えない
          const confirmedHuman = GameState.confirmedHumanIds.includes(target.id);
          let score = 0;
          // Logical wolves prioritize publicly hostile or potentially dangerous opponents.
          score += pressureOnWolf * (0.35 + logic * 0.75);
          if (targetHasVotedWolf) score += 38 + logic * 42;
          if (targetHasSuspectedWolf) score += 42 + logic * 48;
          if (targetHasSuspectedAlly) score += 22 + logic * 30;
          // Seer claims are not an automatic kill order: wolves may keep a visible Seer alive
          // when their reports are still useful as cover or when the Seer has not exposed them.
          if (claimedSeer) {
            const seerHasNamedWolf = (GameState.seerHistoryMap || {})[wolf.id]?.some(r => r.seerId === target.id && r.isWolf);
            score += 8 + logic * 13 + (seerHasNamedWolf ? 22 : 0);
            if (!seerHasNamedWolf && wolf.bias?.usesLoveStrategically) score -= 9;
          }
          if (confirmedHuman) score += 7 + logic * 10;
          score += alert * (0.08 + logic * 0.24) + (100 - trust) * logic * 0.16;
          // Emotional wolves may target disliked opponents or people who constrain them.
          if (wolf.bias?.loveFocus) score += -love * (0.62 + (wolf.bias?.usesLoveStrategically ? -0.18 : 0));
          else score += -love * 0.10;
          // Strategic wolves preserve people who are strongly attached to them, as potential allies/tools.
          if (wolf.bias?.usesLoveStrategically) score -= Math.max(0, affectionTowardWolf) * 0.62;
          score += getRelationValue('grievanceMatrix', wolf, target) * (wolf.bias?.loveFocus ? 0.55 : 0.18);
          score -= getRelationValue('favorMatrix', wolf, target) * (wolf.bias?.usesLoveStrategically ? 0.38 : 0.10);
          if (wolf.bias?.protectTrusted && love > 30) score -= 18;
          return score;
        };
        victim = attackPool.map(target => {
          const individualScores = wolves.map(wolf => attackScore(wolf, target));
          const total = individualScores.reduce((a,b) => a+b, 0) / individualScores.length;
          const strongestPreference = Math.max(...individualScores) * 0.22;
          return { target, score: total + strongestPreference + Math.random() * 18 };
        }).sort((a,b) => b.score - a.score)[0].target;
      }

      GameState.nightHistory.push({ day: GameState.day, hunterId: hunter?.id || null, guardedId, wolfIds: wolves.map(w => w.id), attackedId: victim?.id || null, protected: Boolean(victim && victim.id === guardedId) });

      playDialogueStep({
        speakerPlayer: null,
        speakerName: '',
        actionTag: '夜パート',
        hintText: GameState.viewMode === 'GOD'
          ? `護衛: ${guardedId ? getPlayerById(guardedId)?.name : 'なし'} / 襲撃候補: ${victim ? victim.name : 'なし'}`
          : '',
        text: '静まり返った霧の夜、それぞれの思惑が闇の中で交錯する……',
        baseHoldMs: 1900,
        onComplete: () => {
          if (victim && victim.id === guardedId) {
            triggerEventCutIn(
              `DAY ${GameState.day + 1} 朝`,
              '今夜の犠牲者はいない',
              '狩人の護衛が襲撃を防いだようだ',
              'safe',
              2300
            );
            pushLog('夜明け', '襲撃は防がれ、今朝の犠牲者は発生しなかった', '#34D399');

            playDialogueStep({
              speakerPlayer: null,
              speakerName: '',
              actionTag: '夜明け',
              text: '夜が明けた。誰かが誰かを守ったのか、今朝の犠牲者はいない。',
              baseHoldMs: 1850,
              onComplete: () => {
                if (!checkVictoryCondition()) {
                  beginMorningDay(GameState.day + 1);
                }
              }
            });
          } else if (victim) {
            // 襲撃された人物の投票先・投票行動を、論理重視の生存者が翌日の推理材料にする。
            const deadVoterRecord = [...GameState.voteHistory].reverse().find(v => v.votes.some(x => x.voterId === victim.id));
            if (deadVoterRecord) {
              const deadVote = deadVoterRecord.votes.find(x => x.voterId === victim.id);
              const suspectedTarget = getPlayerById(deadVote?.targetId);
              const priorVotesAgainstTarget = deadVote ? deadVoterRecord.votes.filter(x => x.targetId === deadVote.targetId).length : 0;
              const votedForPublicSuspect = Boolean(suspectedTarget && (
                GameState.confirmedEnemyIds.includes(suspectedTarget.id) ||
                (GameState.seerHistoryMap[victim.id] || []).some(r => r.seerId === suspectedTarget.id && r.isWolf) ||
                getAlertness(victim, suspectedTarget) >= 55
              ));
              getAlivePlayers().filter(observer => observer.id !== victim.id && observer.stats.logic >= 60).forEach(observer => {
                if (suspectedTarget && suspectedTarget.alive && suspectedTarget.id !== observer.id) {
                  const weight = Math.min(18, 7 + observer.stats.logic * 0.09 + priorVotesAgainstTarget * 1.5);
                  adjustAlertness(observer, suspectedTarget, weight, `${victim.name}が襲撃される前に投票していた`);
                  adjustTrust(observer, suspectedTarget, -Math.round(weight * 0.55), `${victim.name}の投票先が襲撃後に注目された`);
                }
                if (votedForPublicSuspect) adjustTrust(observer, victim, 5 + Math.round(observer.stats.logic * 0.04), `${victim.name}が疑わしい人物へ投票していた`);
              });
            }
            victim.alive = false;
            victim.deathCause = '襲撃';
            recomputeConfirmedPlayers();
            triggerEventCutIn(
              `DAY ${GameState.day + 1} 朝`,
              `${victim.name} が無残な姿で発見された`,
              '夜の襲撃による犠牲者',
              'alert',
              2400
            );
            pushLog('襲撃', `${victim.name}が夜の襲撃により退場した`, '#F43F5E');
            pushMonitorMessage(victim, `${victim.name}がモニタールームにやってきた。`, false);

            playDialogueStep({
              speakerPlayer: null,
              speakerName: '',
              actionTag: '犠牲者発表',
              hintText: GameState.viewMode === 'GOD' ? `役職: ${victim.role.name}` : '',
              text: `朝が来た。${victim.name}の姿が見当たらない……夜の襲撃で倒れたようだ。`,
              baseHoldMs: 2000,
              onComplete: () => {
                if (!checkVictoryCondition()) {
                  beginMorningDay(GameState.day + 1);
                }
              }
            });
          } else {
            beginMorningDay(GameState.day + 1);
          }
        }
      });
    }

    /**
     * =========================================================================
     * 13. VICTORY CHECK & MONITOR ROOM BANTER
     * =========================================================================
     */
    function checkVictoryCondition() {
      const alive = getAlivePlayers();
      const wolvesAlive = alive.filter(p => p.role.key === 'WEREWOLF').length;
      const nonWolvesAlive = alive.length - wolvesAlive;

      if (wolvesAlive === 0) {
        finishMatch('VILLAGE', '市民陣営の勝利！人狼はすべて討伐された。');
        return true;
      }
      if (wolvesAlive >= nonWolvesAlive && wolvesAlive > 0) {
        finishMatch('WOLF', '人狼陣営の勝利！霧の円卓は人狼の手に落ちた。');
        return true;
      }
      return false;
    }

    function finishMatch(winnerTeam, summaryText) {
      GameState.phase = 'ENDED';
      clearTimers();

      const isVillage = winnerTeam === 'VILLAGE';
      const prevMode = GameState.viewMode;
      // Temporarily display all roles at the end of the match before moving to the next game
      GameState.viewMode = 'GOD';
      renderStageAndRoster(null);

      const roleSummary = GameState.players
        .map(p => `${p.name}：${p.role.name}`)
        .join(' / ');

      triggerEventCutIn(
        '決着（全役職開示）',
        isVillage ? '市民陣営 勝利' : '人狼陣営 勝利',
        roleSummary,
        isVillage ? 'safe' : 'alert',
        3400
      );
      pushLog('決着', `${summaryText}（${roleSummary}）`, isVillage ? '#34D399' : '#F43F5E');

      playDialogueStep({
        speakerPlayer: null,
        speakerName: '',
        actionTag: '終幕・役職開示',
        hintText: '全参加者の役職を表示中',
        text: `${summaryText}【役職一覧】${roleSummary}`,
        baseHoldMs: 5000,
        onComplete: () => {
          GameState.viewMode = prevMode;
          GameState.matchNumber += 1;
          startNewMatch();
        }
      });
    }

    function triggerMonitorRoomBanter() {
      const dead = getDeadPlayers();
      if (dead.length === 0) return;

      const speaker = dead[Math.floor(Math.random() * dead.length)];
      const banterByCharacter = {
        miva: `外から見てると、無駄な遠回りがよく分かるな。……まあ、本人たちは必死なんだろうけど。`,
        rimera: `みんな頑張ってるわね！ でも、疑うだけじゃなくて、ちゃんと話を聞いてあげてほしいな。`,
        tesuke: `発言の順序を追えば、矛盾点はかなり絞れる。感情より記録を優先すべきだ。`,
        nana: `……その推理は甘い。`,
        ardent: `どうしてそこで黙るのよ。言いたいことがあるなら、はっきり言いなさい！`,
        suikaku: `うーん、今の発言は少し気になるな。みんながどう受け取るかも含めて見ておきたいね。`,
        shinonome: `外から見ると、誰が議論を動かしているかよく分かるね。発言の中身だけじゃなく、流れも見た方がいい。`,
        yukiha: `みんな真剣だねぇ。ボクもあっちに戻って、もう一回お話ししたいな〜。`,
        aldemern: `皆さま、それぞれ懸命に考えていらっしゃいますね。どうか冷静さを失われませんよう。`,
        rashi: `……見ていて飽きませんね。根拠の薄い自信ほど、よく響くものです。`,
        podo: `いや〜、いいねいいね！ もっと疑って、もっと言い合って！ その方が面白いじゃん！`,
        kazura: `議論が少々散らかっていますね。誰が何を確認したのか、整理した方がよさそうです。`,
        muu: `おおっ、今の発言は興味深いのだ！ もう少し詳しく聞きたいのだ〜！`
      };
      const line = banterByCharacter[speaker.id] || `外から見守ることにしよう。`;
      pushMonitorMessage(speaker, line, false);

      // A second eliminated character may respond in their own voice.
      if (dead.length >= 2 && Math.random() < 0.65) {
        const others = dead.filter(p => p.id !== speaker.id);
        const replier = others[Math.floor(Math.random() * others.length)];
        const replyByCharacter = {
          miva: `まあ、言いたいことは分かる。`,
          rimera: `そうね！ でも、まだ挽回できるはずよ！`,
          tesuke: `その見方には一理ある。追加の根拠が必要だが。`,
          nana: `……同感だ。`,
          ardent: `そうよ。そこで遠慮する必要なんてないわ。`,
          suikaku: `確かに。別の可能性も残しておきたいところだね。`,
          shinonome: `そうだね。ただ、決めつけるのはまだ早いかな。`,
          yukiha: `えへへ、二人で見てると気づくこともあるね！`,
          aldemern: `おっしゃる通りでございます。私も同様に感じておりました。`,
          rashi: `あなたにしては、まともな指摘ですね。`,
          podo: `えーっ、そこはもっと派手にいこうよ！`,
          kazura: `同意します。ですが、事実確認は忘れずに。`,
          muu: `なるほどなのだ！ その考えはなかったのだ！`
        };
        const reply = `${replyByCharacter[replier.id] || `なるほど。`}（${speaker.name}の話を受けて）`;
        setTimeout(() => {
          if (GameState.paused) return;
          pushMonitorMessage(replier, reply, true);
        }, 1200);
      }
    }

    /**
     * =========================================================================
     * 14. UI CONTROLS & BOOTSTRAP
     * =========================================================================
     */
    function bindControls() {
      const historyBtn = document.getElementById('openHistoryBtn');
      const historyModal = document.getElementById('historyModal');
      document.getElementById('closeHistoryBtn')?.addEventListener('click', () => historyModal?.classList.add('hidden'));
      historyModal?.addEventListener('click', event => { if (event.target === historyModal) historyModal.classList.add('hidden'); });
      historyBtn?.addEventListener('click', openHistoryModal);

      const detailCloseBtn = document.getElementById('closeCharacterDetailBtn');
      if (detailCloseBtn) detailCloseBtn.addEventListener('click', closeCharacterDetail);
      const detailModal = document.getElementById('characterDetailModal');
      if (detailModal) {
        detailModal.addEventListener('click', (event) => {
          if (event.target === detailModal) closeCharacterDetail();
        });
      }

      const viewBtn = document.getElementById('toggleViewModeBtn');
      if (viewBtn) {
        viewBtn.addEventListener('click', () => {
          AudioEngine.ensureContext();
          GameState.viewMode = GameState.viewMode === 'DEDUCTION' ? 'GOD' : 'DEDUCTION';
          viewBtn.textContent = `視点: ${GameState.viewMode === 'GOD' ? '神視点モード' : '推理モード'}`;
          renderStageAndRoster(null);
        });
      }

      const pauseBtn = document.getElementById('togglePauseBtn');
      if (pauseBtn) {
        pauseBtn.addEventListener('click', () => {
          AudioEngine.ensureContext();
          GameState.paused = !GameState.paused;
          pauseBtn.textContent = GameState.paused ? '再開する' : '一時停止';
        });
      }

      const speedBtn = document.getElementById('cycleSpeedBtn');
      if (speedBtn) {
        const speeds = [1.0, 1.5, 2.0];
        let sIdx = 0;
        speedBtn.addEventListener('click', () => {
          AudioEngine.ensureContext();
          sIdx = (sIdx + 1) % speeds.length;
          GameState.speed = speeds[sIdx];
          speedBtn.textContent = `速度: ${GameState.speed.toFixed(1)}x`;
        });
      }

      const seBtn = document.getElementById('toggleSeBtn');
      if (seBtn) {
        seBtn.addEventListener('click', () => {
          const next = !AudioEngine.isSeEnabled();
          AudioEngine.setSeEnabled(next);
          if (next) AudioEngine.ensureContext();
          seBtn.textContent = `SE: ${next ? 'ON' : 'OFF'}`;
        });
      }

      const bgmBtn = document.getElementById('toggleBgmBtn');
      if (bgmBtn) {
        bgmBtn.addEventListener('click', () => {
          const next = !AudioEngine.isBgmEnabled();
          if (next) AudioEngine.ensureContext();
          AudioEngine.setBgmEnabled(next);
          bgmBtn.textContent = `BGM: ${next ? 'ON' : 'OFF'}`;
        });
      }

      const restartBtn = document.getElementById('restartMatchBtn');
      if (restartBtn) {
        restartBtn.addEventListener('click', () => {
          AudioEngine.ensureContext();
          GameState.matchNumber += 1;
          startNewMatch();
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      bindControls();
      startNewMatch();
    });
  </script>
